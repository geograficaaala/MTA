name: actualizar-viento-nasa

on:
  workflow_dispatch:
  schedule:
    # Todos los días a las 11:30 UTC.
    # Equivale a las 05:30 en Guatemala.
    - cron: "30 11 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-viento-nasa
  cancel-in-progress: false

jobs:
  actualizar-viento-nasa:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar descarga NASA POWER viento
        run: |
          python fetch_viento_nasa.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/viento/historico_municipios.json
          python -m json.tool docs/data/viento/historico_municipios.json > /dev/null
          echo "OK: docs/data/viento/historico_municipios.json generado y validado"

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/viento/historico_municipios.json

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar viento NASA POWER"
            git push
          fi
