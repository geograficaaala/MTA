name: actualizar-prediccion-balance-hidrico

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas.
    - cron: "35 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-prediccion-balance-hidrico
  cancel-in-progress: false

jobs:
  actualizar-prediccion-balance-hidrico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar pronóstico de balance hídrico
        env:
          OPENMETEO_TIMEZONE: "America/Guatemala"
          OPENMETEO_FORECAST_DAYS: "16"
        run: |
          python fetch_prediccion_balance_hidrico.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/agroclima/prediccion_balance_hidrico.json
          python -m json.tool docs/data/agroclima/prediccion_balance_hidrico.json > /dev/null
          echo "Pronóstico de balance hídrico generado y validado correctamente."

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/agroclima/prediccion_balance_hidrico.json

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar predicción de balance hídrico"
            git push
          fi
