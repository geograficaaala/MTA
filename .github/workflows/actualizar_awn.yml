on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas. Guatemala = UTC-6.
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar-awn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Ambient Weather secrets
        env:
          AMBIENT_WEATHER_API_KEY: ${{ secrets.AMBIENT_WEATHER_API_KEY }}
          AMBIENT_WEATHER_APPLICATION_KEY: ${{ secrets.AMBIENT_WEATHER_APPLICATION_KEY }}
        run: |
          if [ -z "$AMBIENT_WEATHER_API_KEY" ]; then
            echo "ERROR: falta el secret AMBIENT_WEATHER_API_KEY"
            exit 1
          fi
          if [ -z "$AMBIENT_WEATHER_APPLICATION_KEY" ]; then
            echo "ERROR: falta el secret AMBIENT_WEATHER_APPLICATION_KEY"
            exit 1
          fi
          echo "Ambient Weather secrets presentes."

      - name: Patch fetch_awn.py to use GitHub Secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("fetch_awn.py")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'AWN_API_KEY\s*=\s*"[^"]*"',
              'AWN_API_KEY = os.environ.get("AMBIENT_WEATHER_API_KEY", "")',
              text,
          )
          text = re.sub(
              r'AWN_APP_KEY\s*=\s*"[^"]*"',
              'AWN_APP_KEY = os.environ.get("AMBIENT_WEATHER_APPLICATION_KEY", "")',
              text,
          )

          path.write_text(text, encoding="utf-8")
          print("fetch_awn.py preparado para leer secrets desde variables de entorno.")
          PY

      - name: Generate AWN station JSON
        env:
          AMBIENT_WEATHER_API_KEY: ${{ secrets.AMBIENT_WEATHER_API_KEY }}
          AMBIENT_WEATHER_APPLICATION_KEY: ${{ secrets.AMBIENT_WEATHER_APPLICATION_KEY }}
        run: |
          python fetch_awn.py
          test -f docs/data/precipitaciones/awn_estacion.json

      - name: Commit AWN data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/precipitaciones/awn_estacion.json
          if git diff --cached --quiet; then
            echo "Sin cambios en awn_estacion.json."
          else
            git commit -m "Actualizar estación AWN"
            git push
          fi
