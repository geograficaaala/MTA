name: Actualizar precipitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  actualizar-precipitaciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml certifi urllib3

      - name: Extraer precipitaciones INSIVUMEH para Sololá
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          import certifi
          import requests
          import urllib3
          from bs4 import BeautifulSoup
          from requests.exceptions import SSLError

          SOURCE_URLS = [
              "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Departamentos.html",
              "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Cronologico.html",
          ]

          OUT_DIR = Path("docs/data/precipitaciones")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          JSON_OUT = OUT_DIR / "insivumeh_solola.json"
          CSV_OUT = OUT_DIR / "insivumeh_solola.csv"
          RAW_OUT = OUT_DIR / "insivumeh_solola_raw.txt"
          DEBUG_OUT = OUT_DIR / "insivumeh_debug_text.txt"

          DEPARTAMENTOS = [
              "alta verapaz",
              "baja verapaz",
              "chimaltenango",
              "chiquimula",
              "el progreso",
              "escuintla",
              "guatemala",
              "huehuetenango",
              "izabal",
              "jalapa",
              "jutiapa",
              "peten",
              "quetzaltenango",
              "quiche",
              "retalhuleu",
              "sacatepequez",
              "san marcos",
              "santa rosa",
              "solola",
              "suchitepequez",
              "totonicapan",
              "zacapa",
              "region norte",
          ]

          def normalizar(texto: str) -> str:
              texto = texto.replace("\ufeff", " ")
              texto = texto.replace("\xa0", " ")
              texto = texto.strip().lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("#", " ")
              texto = texto.replace(":", " ")
              texto = re.sub(r"\s+", " ", texto)
              texto = texto.strip()
              return texto

          def es_solola(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia == "solola" or limpia.startswith("solola ") or " solola " in f" {limpia} "

          def es_departamento(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia in DEPARTAMENTOS

          def numero_mm(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|milimetros|milímetros)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def dias_lluvia(linea: str) -> tuple[int | None, int | None]:
              limpia = normalizar(linea)
              match = re.search(
                  r"([0-9]+)\s*dias\s*con\s*lluvia.*?([0-9]+)\s*dias\s*sin\s*lluvia",
                  limpia,
              )
              if not match:
                  return None, None
              return int(match.group(1)), int(match.group(2))

          def obtener_pagina(url: str) -> tuple[str, str]:
              headers = {
                  "User-Agent": "MTA-Solola-Precipitaciones/0.3 (+https://github.com/geograficaaala/MTA)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  response.encoding = "utf-8"
                  return response.text, "ssl_verificado"
              except SSLError:
                  urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=False,
                  )
                  response.raise_for_status()
                  response.encoding = "utf-8"
                  return response.text, "ssl_no_verificado_por_certificado_fuente"

          def html_a_lineas(html: str) -> list[str]:
              soup = BeautifulSoup(html, "lxml")

              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()

              texto = soup.get_text("\n")
              lineas = [line.strip() for line in texto.splitlines() if line.strip()]
              return lineas

          def obtener_seccion_solola(lines: list[str]) -> list[str]:
              inicio = None

              for i, line in enumerate(lines):
                  if es_solola(line):
                      inicio = i + 1
                      break

              if inicio is None:
                  DEBUG_OUT.write_text("\n".join(lines[:500]), encoding="utf-8")
                  raise RuntimeError(
                      "No se encontró la sección de Sololá. Se guardó debug en docs/data/precipitaciones/insivumeh_debug_text.txt"
                  )

              fin = len(lines)

              for j in range(inicio, len(lines)):
                  if es_departamento(lines[j]) and not es_solola(lines[j]):
                      fin = j
                      break

              return lines[inicio:fin]

          def extraer_estaciones_resumen(seccion: list[str]) -> list[dict]:
              estaciones = []
              i = 0

              while i < len(seccion):
                  linea = seccion[i].strip()

                  if not linea:
                      i += 1
                      continue

                  siguiente = seccion[i + 1].strip() if i + 1 < len(seccion) else ""
                  valor = numero_mm(siguiente)

                  if valor is not None:
                      nombre_estacion = linea
                      rain_days = None
                      dry_days = None

                      for k in range(i + 2, min(i + 8, len(seccion))):
                          rain_days, dry_days = dias_lluvia(seccion[k])
                          if rain_days is not None:
                              break

                      estaciones.append(
                          {
                              "station_id": normalizar(nombre_estacion).replace(" ", "_"),
                              "station_name": nombre_estacion,
                              "department": "Sololá",
                              "institution": "INSIVUMEH",
                              "precipitation_mm_accumulated": valor,
                              "rain_days": rain_days,
                              "dry_days": dry_days,
                              "status": "extraido",
                              "data_type": "observado_publicado",
                              "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
                          }
                      )

                      i += 2
                      continue

                  i += 1

              return estaciones

          def extraer_desde_url(url: str) -> tuple[list[dict], list[str], str]:
              html, ssl_mode = obtener_pagina(url)
              lines = html_a_lineas(html)
              seccion = obtener_seccion_solola(lines)
              estaciones = extraer_estaciones_resumen(seccion)
              return estaciones, seccion, ssl_mode

          errores = []
          estaciones = []
          seccion_solola = []
          url_usada = None
          ssl_mode = None

          for url in SOURCE_URLS:
              try:
                  estaciones, seccion_solola, ssl_mode = extraer_desde_url(url)
                  if estaciones:
                      url_usada = url
                      break
                  errores.append(f"{url}: se encontró Sololá, pero no estaciones.")
              except Exception as exc:
                  errores.append(f"{url}: {exc}")

          if not estaciones:
              DEBUG_OUT.write_text(
                  "ERRORES:\n"
                  + "\n".join(errores)
                  + "\n\nNo se pudieron extraer estaciones.\n",
                  encoding="utf-8",
              )
              raise RuntimeError(
                  "No se pudieron extraer estaciones de Sololá. Revisar docs/data/precipitaciones/insivumeh_debug_text.txt"
              )

          generated_at = datetime.now(timezone.utc).isoformat()

          data = {
              "schema": "mta_precipitaciones_v0_3",
              "generated_at_utc": generated_at,
              "department": "Sololá",
              "source": {
                  "institution": "INSIVUMEH",
                  "url": url_usada,
                  "ssl_mode": ssl_mode,
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "notes": [
                  "Extracción automática diaria desde página institucional autorizada.",
                  "El campo precipitation_mm_accumulated corresponde al acumulado publicado por la fuente al momento de la consulta.",
                  "Los datos deben mostrarse con fuente, fecha de consulta y crédito institucional.",
              ],
              "stations": estaciones,
          }

          JSON_OUT.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          RAW_OUT.write_text("\n".join(seccion_solola), encoding="utf-8")

          with CSV_OUT.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "station_id",
                      "station_name",
                      "department",
                      "institution",
                      "precipitation_mm_accumulated",
                      "rain_days",
                      "dry_days",
                      "status",
                      "data_type",
                      "credit",
                  ],
              )
              writer.writeheader()
              writer.writerows(estaciones)

          print(f"OK: {len(estaciones)} estaciones extraídas para Sololá.")
          print(f"URL usada: {url_usada}")
          print(f"Modo SSL: {ssl_mode}")
          print(JSON_OUT)
          print(CSV_OUT)
          PY

      - name: Guardar cambios generados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/precipitaciones/ || true

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en precipitaciones."
          else
            git commit -m "Actualizar precipitaciones INSIVUMEH Solola"
            git push
          fi
