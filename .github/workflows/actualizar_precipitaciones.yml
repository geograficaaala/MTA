name: Actualizar precipitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  actualizar-precipitaciones:
    runs-on: ubuntu-latest

    env:
      AMBIENT_WEATHER_API_KEY: ${{ secrets.AMBIENT_WEATHER_API_KEY }}
      AMBIENT_WEATHER_APPLICATION_KEY: ${{ secrets.AMBIENT_WEATHER_APPLICATION_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml certifi urllib3 playwright
          python -m playwright install chromium

      - name: Extraer precipitaciones
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import os
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin
          from zoneinfo import ZoneInfo

          import certifi
          import requests
          import urllib3
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          from requests.exceptions import SSLError

          GT = ZoneInfo("America/Guatemala")

          DATA_ROOT = Path("docs/data/precipitaciones")
          HIST_ROOT = DATA_ROOT / "historico"
          RAW_ROOT = DATA_ROOT / "raw"

          DATA_ROOT.mkdir(parents=True, exist_ok=True)
          HIST_ROOT.mkdir(parents=True, exist_ok=True)
          RAW_ROOT.mkdir(parents=True, exist_ok=True)

          CONFIG_JSON = DATA_ROOT / "pws_config.json"

          ACTUAL_JSON = DATA_ROOT / "actual.json"
          SOURCE_STATUS_JSON = DATA_ROOT / "source_status.json"

          INVENTARIO_JSON = DATA_ROOT / "estaciones_precipitacion.json"
          INVENTARIO_CSV = DATA_ROOT / "estaciones_precipitacion.csv"

          INSIVUMEH_COMPAT_JSON = DATA_ROOT / "insivumeh_solola.json"
          INSIVUMEH_COMPAT_CSV = DATA_ROOT / "insivumeh_solola.csv"
          INSIVUMEH_RAW_TXT = DATA_ROOT / "insivumeh_solola_raw.txt"

          VIVAMOS_MEJOR_JSON = DATA_ROOT / "vivamos_mejor_precipitacion.json"
          VIVAMOS_MEJOR_RAW_TXT = DATA_ROOT / "vivamos_mejor_raw.txt"

          PWS_JSON = DATA_ROOT / "pws_precipitacion.json"

          SOURCES = [
              {
                  "source_id": "insivumeh_precipitaciones_departamentos",
                  "institution": "INSIVUMEH",
                  "parser": "insivumeh_solola",
                  "urls": [
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Departamentos.html",
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Cronologico.html",
                  ],
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "vivamos_mejor_estaciones",
                  "institution": "Asociación Vivamos Mejor",
                  "parser": "vivamos_mejor_inventory",
                  "urls": [
                      "https://www.vivamosmejor.org.gt/sitio/estaciones-meteorologicas-solola/",
                  ],
                  "credit": "Datos: Asociación Vivamos Mejor. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "pws_configuradas",
                  "institution": "PWS configuradas manualmente",
                  "parser": "pws_config",
                  "urls": [],
                  "credit": "Datos: estación meteorológica complementaria pública. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
          ]

          FALLBACK_PWS_CONFIG = {
              "schema": "mta_pws_precipitacion_config_fallback_v1",
              "stations": []
          }

          VIVAMOS_MEJOR_FALLBACK_STATIONS = [
              {"station_name": "Estación Oficina Central", "municipality": "Panajachel", "status": "por_verificar"},
              {"station_name": "Estación Casa Santa Rita", "municipality": "Santa Lucía Utatlán", "status": "por_verificar"},
              {"station_name": "Estación CoAtitlán R.L.", "municipality": "Santiago Atitlán", "status": "por_verificar"},
              {"station_name": "Estación Lomas de Atitlán", "municipality": "San Andrés Semetabaj", "status": "por_verificar"},
              {"station_name": "Estación CEDRACC", "municipality": "Santa Cruz La Laguna", "status": "por_verificar"},
              {"station_name": "Estación Santa Clara TV Cable", "municipality": "Santa Clara La Laguna", "status": "por_verificar"},
              {"station_name": "Caserío Chuacruz", "municipality": "Aldea Pujujil I, Sololá", "status": "mantenimiento"},
              {"station_name": "Estación Escuela de Formación Agrícola", "municipality": "Sololá", "status": "por_verificar"},
          ]

          DEPARTAMENTOS = [
              "alta verapaz",
              "baja verapaz",
              "chimaltenango",
              "chiquimula",
              "el progreso",
              "escuintla",
              "guatemala",
              "huehuetenango",
              "izabal",
              "jalapa",
              "jutiapa",
              "peten",
              "quetzaltenango",
              "quiche",
              "retalhuleu",
              "sacatepequez",
              "san marcos",
              "santa rosa",
              "solola",
              "suchitepequez",
              "totonicapan",
              "zacapa",
              "region norte",
          ]

          AMBIENT_SANTA_CATARINA_DASHBOARD_ID = "4bd244f9e8c5b0cb889ba4cbb1a463c3"

          def now_times() -> tuple[datetime, datetime]:
              utc = datetime.now(timezone.utc)
              gt = utc.astimezone(GT)
              return utc, gt

          def normalizar(texto: str) -> str:
              texto = str(texto or "")
              texto = texto.replace("\ufeff", " ")
              texto = texto.replace("\xa0", " ")
              texto = texto.strip().lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("#", " ")
              texto = texto.replace(":", " ")
              texto = re.sub(r"\s+", " ", texto)
              return texto.strip()

          def slug(texto: str) -> str:
              limpio = normalizar(texto)
              limpio = re.sub(r"[^a-z0-9]+", "_", limpio)
              return limpio.strip("_")

          def make_station_id(institution: str, station_name: str) -> str:
              return f"{slug(institution)}_{slug(station_name)}"

          def es_solola(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia == "solola" or limpia.startswith("solola ") or " solola " in f" {limpia} "

          def es_departamento(linea: str) -> bool:
              return normalizar(linea) in DEPARTAMENTOS

          def numero_mm(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|milimetros|milímetros)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def pulgadas_a_mm(value: float) -> float:
              return round(value * 25.4, 3)

          def buscar_dias_en_bloque(lineas: list[str]) -> tuple[int | None, int | None]:
              texto = " | ".join(normalizar(x) for x in lineas)

              con_lluvia = None
              sin_lluvia = None

              match_con = re.search(r"([0-9]+)\s*dias?\s*con\s*lluvia", texto)
              match_sin = re.search(r"([0-9]+)\s*dias?\s*sin\s*lluvia", texto)

              if match_con:
                  con_lluvia = int(match_con.group(1))
              if match_sin:
                  sin_lluvia = int(match_sin.group(1))

              return con_lluvia, sin_lluvia

          def fetch_url(url: str) -> tuple[str, dict]:
              headers = {
                  "User-Agent": "MTA-Solola-Precipitaciones/1.1 (+https://github.com/geograficaaala/MTA)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }

              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "ssl_mode": None,
                  "content_length": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  response.encoding = response.apparent_encoding or "utf-8"
                  status.update({
                      "ok": True,
                      "status_code": response.status_code,
                      "ssl_mode": "ssl_verificado",
                      "content_length": len(response.text),
                  })
                  return response.text, status

              except SSLError:
                  try:
                      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
                      response = requests.get(
                          url,
                          timeout=45,
                          headers=headers,
                          verify=False,
                      )
                      response.raise_for_status()
                      response.encoding = response.apparent_encoding or "utf-8"
                      status.update({
                          "ok": True,
                          "status_code": response.status_code,
                          "ssl_mode": "ssl_no_verificado_por_certificado_fuente",
                          "content_length": len(response.text),
                      })
                      return response.text, status
                  except Exception as exc:
                      status["error"] = str(exc)
                      return "", status

              except Exception as exc:
                  status["error"] = str(exc)
                  return "", status

          def fetch_json(url: str, params: dict) -> tuple[object | None, dict]:
              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      params=params,
                      headers={
                          "User-Agent": "MTA-Solola-AmbientWeather/1.1",
                          "Accept": "application/json",
                      },
                      verify=certifi.where(),
                  )
                  status["status_code"] = response.status_code
                  response.raise_for_status()
                  status["ok"] = True
                  return response.json(), status
              except Exception as exc:
                  status["error"] = str(exc)
                  return None, status

          def html_to_soup(html: str) -> BeautifulSoup:
              soup = BeautifulSoup(html, "lxml")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              return soup

          def soup_to_lines(soup: BeautifulSoup) -> list[str]:
              return [line.strip() for line in soup.get_text("\n").splitlines() if line.strip()]

          def load_json(path: Path, default: dict) -> dict:
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def write_json(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          def load_pws_config() -> dict:
              if CONFIG_JSON.exists():
                  return load_json(CONFIG_JSON, FALLBACK_PWS_CONFIG)
              return FALLBACK_PWS_CONFIG

          def fecha_actual_rango(gt_now: datetime) -> tuple[str, str]:
              day = gt_now.strftime("%Y-%m-%d")
              return day, day

          def build_history_url(station: dict, start_date: str, end_date: str) -> str | None:
              template = station.get("history_url_template")

              if template:
                  return template.replace("{start_date}", start_date).replace("{end_date}", end_date)

              provider = station.get("provider")
              code = station.get("station_code")

              if provider == "wunderground" and code:
                  return f"https://www.wunderground.com/dashboard/pws/{code}/table/{start_date}/{end_date}/monthly"

              return station.get("provided_url") or station.get("station_url")

          def precipitation_record(
              *,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              source_id: str,
              institution: str,
              station_name: str,
              variable: str,
              value: float | int,
              unit: str,
              source_url: str,
              credit: str,
              aggregation_period: str,
              quality_flag: str = "raw_published",
          ) -> dict:
              station_id = make_station_id(institution, station_name)
              variable_slug = slug(variable)

              return {
                  "record_id": f"{observed_date}_{source_id}_{station_id}_{variable_slug}",
                  "observed_date": observed_date,
                  "extracted_at_utc": extracted_at_utc,
                  "extracted_at_gt": extracted_at_gt,
                  "department": "Sololá",
                  "station_id": station_id,
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "variable": variable,
                  "value": value,
                  "unit": unit,
                  "aggregation_period": aggregation_period,
                  "data_type": "observado_publicado",
                  "quality_flag": quality_flag,
                  "source_url": source_url,
                  "credit": credit,
              }

          def station_inventory_record(
              *,
              source_id: str,
              institution: str,
              station_name: str,
              municipality: str | None,
              status: str,
              source_url: str | None,
              credit: str,
              station_url: str | None = None,
              provider: str | None = None,
              station_code: str | None = None,
              precipitation_available: str = "por_verificar",
              online_status: str = "por_verificar",
              inventory_method: str = "extracted",
              quality_class: str = "por_verificar",
          ) -> dict:
              return {
                  "station_id": make_station_id(institution, station_name),
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "department": "Sololá",
                  "municipality": municipality,
                  "status": status,
                  "variable": "precipitation",
                  "provider": provider,
                  "station_code": station_code,
                  "precipitation_available": precipitation_available,
                  "online_status": online_status,
                  "quality_class": quality_class,
                  "source_url": source_url,
                  "station_url": station_url,
                  "inventory_method": inventory_method,
                  "credit": credit,
              }

          def obtener_seccion_solola(lines: list[str]) -> list[str]:
              inicio = None

              for i, line in enumerate(lines):
                  if es_solola(line):
                      inicio = i + 1
                      break

              if inicio is None:
                  raise RuntimeError("No se encontró la sección de Sololá.")

              fin = len(lines)

              for j in range(inicio, len(lines)):
                  if es_departamento(lines[j]) and not es_solola(lines[j]):
                      fin = j
                      break

              return lines[inicio:fin]

          def parse_insivumeh_precip(
              source: dict,
              html: str,
              source_url: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              observed_date: str,
          ) -> tuple[list[dict], list[dict], list[str], list[dict]]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              seccion = obtener_seccion_solola(lines)

              records = []
              stations = []
              compat_rows = []

              i = 0
              while i < len(seccion):
                  linea = seccion[i].strip()
                  siguiente = seccion[i + 1].strip() if i + 1 < len(seccion) else ""
                  valor_precip = numero_mm(siguiente)

                  if valor_precip is not None:
                      station_name = linea
                      bloque = seccion[i:i + 12]
                      rain_days, dry_days = buscar_dias_en_bloque(bloque)

                      records.append(precipitation_record(
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          variable="precipitation_accumulated",
                          value=valor_precip,
                          unit="mm",
                          aggregation_period="periodo_publicado_por_fuente",
                          source_url=source_url,
                          credit=source["credit"],
                      ))

                      if rain_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="rain_days",
                              value=rain_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      if dry_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="dry_days",
                              value=dry_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      stations.append(station_inventory_record(
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          municipality=None,
                          status="activa_por_verificar",
                          source_url=source_url,
                          station_url=None,
                          provider="insivumeh",
                          station_code=None,
                          credit=source["credit"],
                          precipitation_available="si",
                          online_status="online",
                          inventory_method="from_precipitation_page",
                          quality_class="oficial",
                      ))

                      compat_rows.append({
                          "station_id": make_station_id(source["institution"], station_name),
                          "station_name": station_name,
                          "department": "Sololá",
                          "institution": source["institution"],
                          "precipitation_mm_accumulated": valor_precip,
                          "rain_days": rain_days,
                          "dry_days": dry_days,
                          "status": "extraido",
                          "data_type": "observado_publicado",
                          "credit": source["credit"],
                      })

                      i += 2
                      continue

                  i += 1

              return records, stations, seccion, compat_rows

          def is_real_station_link(url: str) -> bool:
              clean = normalizar(url)
              return (
                  "wunderground.com/dashboard/pws/" in clean
                  or "ambientweather.net/dashboard" in clean
                  or "weatherlink.com" in clean
                  or "pwsweather" in clean
              )

          def detect_provider_and_code(url: str) -> tuple[str | None, str | None]:
              clean = url.strip()

              match_wu = re.search(r"wunderground\.com/dashboard/pws/([A-Za-z0-9_-]+)", clean, flags=re.I)
              if match_wu:
                  return "wunderground", match_wu.group(1).upper()

              if "ambientweather.net" in clean.lower():
                  return "ambientweather", None

              if "weatherlink.com" in clean.lower():
                  return "weatherlink", None

              if "pwsweather" in clean.lower():
                  return "pwsweather", None

              return None, None

          def parse_vivamos_mejor_inventory(source: dict, html: str, source_url: str) -> tuple[list[dict], list[dict], dict, str]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              raw_text = "\n".join(lines)

              all_links = []
              station_links = []

              for a in soup.find_all("a"):
                  label = a.get_text(" ", strip=True)
                  href = a.get("href")

                  if not href:
                      continue

                  full_url = urljoin(source_url, href)
                  provider, station_code = detect_provider_and_code(full_url)

                  item = {
                      "label": label,
                      "url": full_url,
                      "provider": provider,
                      "station_code": station_code,
                  }

                  all_links.append(item)

                  if is_real_station_link(full_url):
                      station_links.append(item)

              parsed = []
              i = 0

              while i < len(lines):
                  line = lines[i].strip()
                  clean = normalizar(line)

                  is_station = (
                      clean.startswith("estacion ")
                      or clean.startswith("estación ")
                      or clean.startswith("caserio ")
                      or clean.startswith("caserío ")
                  )

                  if is_station:
                      station_name = line
                      municipality = None
                      status = "por_verificar"

                      for j in range(i + 1, min(i + 7, len(lines))):
                          candidate = lines[j].strip()
                          candidate_clean = normalizar(candidate)

                          if not candidate:
                              continue

                          if "mantenimiento" in candidate_clean:
                              status = "mantenimiento"
                              break

                          if "accede aqui" in candidate_clean or "accede aquí" in candidate_clean:
                              break

                          if (
                              not candidate_clean.startswith("estacion")
                              and not candidate_clean.startswith("estación")
                              and "meteorologica" not in candidate_clean
                              and "meteorológica" not in candidate_clean
                          ):
                              municipality = candidate
                              break

                      parsed.append({
                          "station_name": station_name,
                          "municipality": municipality,
                          "status": status,
                      })

                  i += 1

              inventory_method = "extracted_from_source_page"

              if not parsed:
                  parsed = VIVAMOS_MEJOR_FALLBACK_STATIONS
                  inventory_method = "fallback_from_known_public_listing"

              stations = []

              for idx, item in enumerate(parsed):
                  link = station_links[idx] if idx < len(station_links) else None
                  station_url = link["url"] if link else None
                  provider = link["provider"] if link else None
                  station_code = link["station_code"] if link else None

                  stations.append(station_inventory_record(
                      source_id=source["source_id"],
                      institution=source["institution"],
                      station_name=item["station_name"],
                      municipality=item.get("municipality"),
                      status=item.get("status") or "por_verificar",
                      source_url=source_url,
                      station_url=station_url,
                      provider=provider,
                      station_code=station_code,
                      credit=source["credit"],
                      precipitation_available="por_verificar",
                      online_status="en_inventario",
                      inventory_method=inventory_method,
                      quality_class="institucional_local",
                  ))

              metadata = {
                  "station_count": len(stations),
                  "all_links_found": len(all_links),
                  "real_station_links_found": len(station_links),
                  "real_station_links": station_links,
                  "ignored_links": [x for x in all_links if not is_real_station_link(x["url"])],
                  "inventory_method": inventory_method,
                  "note": "Inventario institucional de Vivamos Mejor. Para datos numéricos se usa pws_config.json cuando la estación tiene URL funcional.",
              }

              return stations, station_links, metadata, raw_text

          def render_page_text_with_playwright(url: str) -> tuple[str, str, dict]:
              status = {
                  "url": url,
                  "ok": False,
                  "usable": False,
                  "engine": "playwright_chromium",
                  "error": None,
                  "html_length": None,
                  "text_length": None,
              }

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36 MTA-Solola/1.1",
                  )

                  try:
                      try:
                          page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      except Exception as exc:
                          status["error"] = f"goto_domcontentloaded: {exc}"

                      page.wait_for_timeout(9000)

                      try:
                          page.wait_for_load_state("networkidle", timeout=15000)
                          status["ok"] = True
                      except Exception as exc:
                          if status["error"]:
                              status["error"] += f" | networkidle: {exc}"
                          else:
                              status["error"] = f"networkidle: {exc}"

                      text = page.locator("body").inner_text(timeout=20000)
                      html = page.content()

                      status["html_length"] = len(html)
                      status["text_length"] = len(text)
                      status["usable"] = bool(text.strip()) or bool(html.strip())

                      return text, html, status

                  except Exception as exc:
                      if status["error"]:
                          status["error"] += f" | final: {exc}"
                      else:
                          status["error"] = str(exc)

                      try:
                          text = page.locator("body").inner_text(timeout=5000)
                          html = page.content()
                          status["html_length"] = len(html)
                          status["text_length"] = len(text)
                          status["usable"] = bool(text.strip()) or bool(html.strip())
                          return text, html, status
                      except Exception:
                          return "", "", status

                  finally:
                      browser.close()

          def extract_wunderground_precip(text: str, html: str) -> tuple[float | None, str | None, str]:
              combined = text + "\n" + html

              patterns = [
                  r"Precipitation\s+([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Precipitation[\s\S]{0,160}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Rainfall[\s\S]{0,160}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Rain[\s\S]{0,160}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
              ]

              for pattern in patterns:
                  match = re.search(pattern, combined, flags=re.I)
                  if match:
                      value_in = float(match.group(1).replace(",", "."))
                      return pulgadas_a_mm(value_in), match.group(0), "in_to_mm"

              mm_value = numero_mm(combined)
              if mm_value is not None and "precip" in normalizar(combined):
                  return mm_value, "precipitation_mm_detected", "mm"

              return None, None, "not_found"

          def ambient_weather_enabled() -> bool:
              return bool(os.getenv("AMBIENT_WEATHER_API_KEY", "").strip()) and bool(os.getenv("AMBIENT_WEATHER_APPLICATION_KEY", "").strip())

          def is_santa_catarina_ambient_station(station: dict) -> bool:
              dashboard_id = str(station.get("dashboard_id") or "")
              name = normalizar(station.get("station_name") or "")
              municipality = normalizar(station.get("municipality") or "")
              return (
                  dashboard_id == AMBIENT_SANTA_CATARINA_DASHBOARD_ID
                  or "santa catarina" in name
                  or "santa catarina" in municipality
              )

          def fetch_ambient_devices() -> tuple[list[dict], dict]:
              api_key = os.getenv("AMBIENT_WEATHER_API_KEY", "").strip()
              app_key = os.getenv("AMBIENT_WEATHER_APPLICATION_KEY", "").strip()

              if not api_key or not app_key:
                  return [], {
                      "url": "https://api.ambientweather.net/v1/devices",
                      "ok": False,
                      "error": "ambient_weather_secrets_missing",
                  }

              payload, status = fetch_json(
                  "https://api.ambientweather.net/v1/devices",
                  params={
                      "apiKey": api_key,
                      "applicationKey": app_key,
                  },
              )

              if not status["ok"] or payload is None:
                  return [], status

              if isinstance(payload, list):
                  return payload, status

              return [], {
                  **status,
                  "ok": False,
                  "error": "ambient_weather_payload_no_es_lista",
              }

          def device_text(device: dict) -> str:
              parts = []

              for key in ["macAddress", "lastData", "info"]:
                  value = device.get(key)
                  if isinstance(value, dict):
                      parts.append(json.dumps(value, ensure_ascii=False))
                  else:
                      parts.append(str(value or ""))

              return normalizar(" ".join(parts))

          def choose_ambient_device(devices: list[dict], station: dict) -> tuple[dict | None, str]:
              configured_mac = (
                  station.get("mac_address")
                  or station.get("macAddress")
                  or station.get("mac")
              )

              if configured_mac:
                  configured_mac_clean = normalizar(configured_mac).replace(" ", "").replace(":", "")
                  for device in devices:
                      device_mac = str(device.get("macAddress") or "")
                      device_mac_clean = normalizar(device_mac).replace(" ", "").replace(":", "")
                      if device_mac_clean == configured_mac_clean:
                          return device, "matched_by_mac"

                  return None, "configured_mac_not_found"

              if len(devices) == 1:
                  return devices[0], "single_device_available"

              wanted_tokens = [
                  token for token in re.split(r"[_\W]+", normalizar(
                      f"{station.get('station_name', '')} {station.get('municipality', '')}"
                  ))
                  if len(token) >= 4
              ]

              best_device = None
              best_score = 0

              for device in devices:
                  text = device_text(device)
                  score = sum(1 for token in wanted_tokens if token in text)

                  if score > best_score:
                      best_score = score
                      best_device = device

              if best_device and best_score >= 2:
                  return best_device, f"matched_by_text_score_{best_score}"

              return None, "multiple_devices_need_mac_address"

          def ambient_daily_precip_mm(last_data: dict) -> tuple[float | None, str | None, str | None]:
              fields_in = [
                  "dailyrainin",
                  "dailyRainIn",
                  "daily_rain_in",
                  "rainDayIn",
                  "eventrainin",
                  "hourlyrainin",
              ]

              fields_mm = [
                  "dailyrainmm",
                  "dailyRainMm",
                  "daily_rain_mm",
                  "rainDayMm",
              ]

              for field in fields_mm:
                  if field in last_data:
                      try:
                          return round(float(last_data[field]), 3), field, "mm"
                      except Exception:
                          pass

              for field in fields_in:
                  if field in last_data:
                      try:
                          return pulgadas_a_mm(float(last_data[field])), field, "in_to_mm"
                      except Exception:
                          pass

              return None, None, None

          def fetch_ambient_precip_with_config(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              ambient_devices: list[dict],
              ambient_status: dict,
          ) -> tuple[dict | None, dict, dict]:
              station_name = station.get("station_name") or "Ambient Weather sin nombre"
              institution = station.get("institution") or "Ambient Weather"
              credit = station.get("credit") or "Datos: Ambient Weather. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá."
              station_url = station.get("station_url")

              inventory = station_inventory_record(
                  source_id=source["source_id"],
                  institution=institution,
                  station_name=station_name,
                  municipality=station.get("municipality"),
                  status=station.get("status") or "activa_api_ambientweather",
                  source_url=station_url or "https://api.ambientweather.net/v1/devices",
                  station_url=station_url,
                  provider="ambientweather",
                  station_code=station.get("dashboard_id") or station.get("mac_address") or station.get("macAddress"),
                  credit=credit,
                  precipitation_available="por_verificar",
                  online_status="por_verificar",
                  inventory_method="ambientweather_api",
                  quality_class=station.get("quality_class") or "complementaria",
              )

              result = {
                  "station_id": inventory["station_id"],
                  "station_name": station_name,
                  "provider": "ambientweather",
                  "dashboard_id": station.get("dashboard_id"),
                  "station_url": station_url,
                  "ok": False,
                  "online_status": "por_verificar",
                  "precipitation_found": False,
                  "precipitation_mm": None,
                  "matched_field": None,
                  "unit_conversion": None,
                  "device_match_method": None,
                  "error": None,
                  "ambient_api_status": {
                      "ok": ambient_status.get("ok"),
                      "status_code": ambient_status.get("status_code"),
                      "error": ambient_status.get("error"),
                  },
              }

              if not ambient_weather_enabled():
                  result["online_status"] = "api_sin_credenciales"
                  result["error"] = "ambient_weather_secrets_missing"
                  inventory["online_status"] = "api_sin_credenciales"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              if not ambient_status.get("ok"):
                  result["online_status"] = "api_error"
                  result["error"] = ambient_status.get("error") or "ambient_api_error"
                  inventory["online_status"] = "api_error"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              device, match_method = choose_ambient_device(ambient_devices, station)
              result["device_match_method"] = match_method

              if not device:
                  result["online_status"] = "api_dispositivo_no_identificado"
                  result["error"] = match_method
                  inventory["online_status"] = "api_dispositivo_no_identificado"
                  inventory["precipitation_available"] = "por_verificar"
                  return None, result, inventory

              last_data = device.get("lastData") or {}

              if not isinstance(last_data, dict):
                  result["online_status"] = "api_sin_lastdata"
                  result["error"] = "ambient_device_without_lastData"
                  inventory["online_status"] = "api_sin_lastdata"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              value_mm, field, conversion = ambient_daily_precip_mm(last_data)

              if value_mm is None:
                  result["ok"] = True
                  result["online_status"] = "online_sin_precipitacion_detectada"
                  result["error"] = "ambient_precipitation_field_not_found"
                  inventory["online_status"] = "online_sin_precipitacion_detectada"
                  inventory["precipitation_available"] = "por_verificar"
                  return None, result, inventory

              result["ok"] = True
              result["online_status"] = "online"
              result["precipitation_found"] = True
              result["precipitation_mm"] = value_mm
              result["matched_field"] = field
              result["unit_conversion"] = conversion

              inventory["online_status"] = "online"
              inventory["precipitation_available"] = "si_extraida_api"

              record = precipitation_record(
                  observed_date=observed_date,
                  extracted_at_utc=extracted_at_utc,
                  extracted_at_gt=extracted_at_gt,
                  source_id=source["source_id"],
                  institution=institution,
                  station_name=station_name,
                  variable="precipitation_accumulated",
                  value=value_mm,
                  unit="mm",
                  aggregation_period=f"ambientweather_lastData:{field}",
                  source_url=station_url or "https://api.ambientweather.net/v1/devices",
                  credit=credit,
                  quality_flag="pws_complementaria_ambientweather_api",
              )

              return record, result, inventory

          def fetch_wunderground_precip_with_config(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              start_date: str,
              end_date: str,
          ) -> tuple[dict | None, dict, dict]:
              provider = station.get("provider")
              station_name = station.get("station_name") or station.get("station_code") or "PWS sin nombre"
              institution = station.get("institution") or source["institution"]
              credit = station.get("credit") or source["credit"]
              station_url = station.get("station_url")
              history_url = build_history_url(station, start_date, end_date)

              inventory = station_inventory_record(
                  source_id=source["source_id"],
                  institution=institution,
                  station_name=station_name,
                  municipality=station.get("municipality"),
                  status=station.get("status") or "por_verificar",
                  source_url=history_url or station_url,
                  station_url=station_url,
                  provider=provider,
                  station_code=station.get("station_code") or station.get("dashboard_id"),
                  credit=credit,
                  precipitation_available="por_verificar",
                  online_status="por_verificar",
                  inventory_method="pws_config_json",
                  quality_class=station.get("quality_class") or "complementaria",
              )

              result = {
                  "station_id": inventory["station_id"],
                  "station_name": station_name,
                  "provider": provider,
                  "station_code": station.get("station_code"),
                  "dashboard_id": station.get("dashboard_id"),
                  "station_url": station_url,
                  "history_url": history_url,
                  "enabled": station.get("enabled", True),
                  "enabled_current_extraction": station.get("enabled_current_extraction", True),
                  "enabled_historical_extraction": station.get("enabled_historical_extraction", False),
                  "ok": False,
                  "online_status": "por_verificar",
                  "precipitation_found": False,
                  "precipitation_mm": None,
                  "error": None,
                  "matched_text": None,
                  "unit_conversion": None,
              }

              if not station.get("enabled", True):
                  result["online_status"] = "deshabilitada"
                  result["error"] = "station_disabled"
                  inventory["online_status"] = "deshabilitada"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              if not station.get("enabled_current_extraction", True):
                  if station.get("enabled_historical_extraction"):
                      result["online_status"] = "historica_no_actual"
                      result["error"] = "current_extraction_disabled_historical_only"
                      inventory["online_status"] = "historica"
                      inventory["precipitation_available"] = "historica_por_verificar"
                  else:
                      result["online_status"] = "requiere_parser_o_configuracion"
                      result["error"] = "current_extraction_disabled"
                      inventory["online_status"] = "requiere_parser"
                      inventory["precipitation_available"] = "por_verificar"

                  return None, result, inventory

              if not history_url:
                  result["online_status"] = "sin_url"
                  result["error"] = "missing_history_url"
                  inventory["online_status"] = "sin_url"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              try:
                  text, html, render_status = render_page_text_with_playwright(history_url)
                  result["render_status"] = render_status

                  raw_file = RAW_ROOT / f"wunderground_{slug(station_name)}_{observed_date}.txt"
                  raw_file.write_text(text[:30000], encoding="utf-8")
                  result["raw_text_path"] = str(raw_file)

                  if not render_status.get("usable") and not text and not html:
                      result["online_status"] = "offline_o_no_render"
                      result["error"] = render_status.get("error") or "render_failed"
                      inventory["online_status"] = "offline_o_no_render"
                      inventory["precipitation_available"] = "no"
                      return None, result, inventory

                  value_mm, matched, conversion = extract_wunderground_precip(text, html)

                  if value_mm is None:
                      result["ok"] = True
                      result["online_status"] = "online_sin_dato_detectado"
                      result["error"] = "precipitacion_no_detectada_en_tabla_renderizada"
                      inventory["online_status"] = "online_sin_dato_detectado"
                      inventory["precipitation_available"] = "por_verificar"
                      return None, result, inventory

                  result["ok"] = True
                  result["online_status"] = "online"
                  result["precipitation_found"] = True
                  result["precipitation_mm"] = value_mm
                  result["matched_text"] = matched
                  result["unit_conversion"] = conversion

                  if isinstance(result.get("render_status"), dict):
                      result["render_status"]["usable"] = True
                      result["render_status"]["effective_ok"] = True

                  inventory["online_status"] = "online"
                  inventory["precipitation_available"] = "si_extraida"

                  record = precipitation_record(
                      observed_date=observed_date,
                      extracted_at_utc=extracted_at_utc,
                      extracted_at_gt=extracted_at_gt,
                      source_id=source["source_id"],
                      institution=institution,
                      station_name=station_name,
                      variable="precipitation_accumulated",
                      value=value_mm,
                      unit="mm",
                      aggregation_period=f"wunderground_table:{start_date}_to_{end_date}",
                      source_url=history_url,
                      credit=credit,
                      quality_flag="pws_complementaria_rendered_table",
                  )

                  return record, result, inventory

              except Exception as exc:
                  result["online_status"] = "error"
                  result["error"] = str(exc)
                  inventory["online_status"] = "error"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

          def fetch_pws_precip_with_config(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              start_date: str,
              end_date: str,
              ambient_devices: list[dict],
              ambient_status: dict,
          ) -> tuple[dict | None, dict, dict]:
              provider = station.get("provider")

              ambient_override = (
                  provider == "ambientweather"
                  and ambient_weather_enabled()
                  and is_santa_catarina_ambient_station(station)
              )

              if provider == "ambientweather":
                  if not station.get("enabled_current_extraction", True) and not ambient_override:
                      station_name = station.get("station_name") or "Ambient Weather sin nombre"
                      institution = station.get("institution") or source["institution"]
                      credit = station.get("credit") or source["credit"]
                      station_url = station.get("station_url")

                      inventory = station_inventory_record(
                          source_id=source["source_id"],
                          institution=institution,
                          station_name=station_name,
                          municipality=station.get("municipality"),
                          status=station.get("status") or "requiere_parser_ambientweather",
                          source_url=station_url,
                          station_url=station_url,
                          provider="ambientweather",
                          station_code=station.get("dashboard_id"),
                          credit=credit,
                          precipitation_available="por_verificar",
                          online_status="requiere_parser",
                          inventory_method="pws_config_json",
                          quality_class=station.get("quality_class") or "complementaria",
                      )

                      result = {
                          "station_id": inventory["station_id"],
                          "station_name": station_name,
                          "provider": "ambientweather",
                          "dashboard_id": station.get("dashboard_id"),
                          "station_url": station_url,
                          "ok": False,
                          "online_status": "requiere_parser",
                          "precipitation_found": False,
                          "precipitation_mm": None,
                          "error": "current_extraction_disabled",
                      }

                      return None, result, inventory

                  return fetch_ambient_precip_with_config(
                      station=station,
                      source=source,
                      observed_date=observed_date,
                      extracted_at_utc=extracted_at_utc,
                      extracted_at_gt=extracted_at_gt,
                      ambient_devices=ambient_devices,
                      ambient_status=ambient_status,
                  )

              if provider == "wunderground":
                  return fetch_wunderground_precip_with_config(
                      station=station,
                      source=source,
                      observed_date=observed_date,
                      extracted_at_utc=extracted_at_utc,
                      extracted_at_gt=extracted_at_gt,
                      start_date=start_date,
                      end_date=end_date,
                  )

              station_name = station.get("station_name") or "PWS sin nombre"
              institution = station.get("institution") or source["institution"]
              credit = station.get("credit") or source["credit"]
              station_url = station.get("station_url")

              inventory = station_inventory_record(
                  source_id=source["source_id"],
                  institution=institution,
                  station_name=station_name,
                  municipality=station.get("municipality"),
                  status=station.get("status") or "requiere_parser",
                  source_url=station_url,
                  station_url=station_url,
                  provider=provider,
                  station_code=station.get("station_code") or station.get("dashboard_id"),
                  credit=credit,
                  precipitation_available="por_verificar",
                  online_status="requiere_parser",
                  inventory_method="pws_config_json",
                  quality_class=station.get("quality_class") or "complementaria",
              )

              result = {
                  "station_id": inventory["station_id"],
                  "station_name": station_name,
                  "provider": provider,
                  "station_url": station_url,
                  "ok": False,
                  "online_status": "requiere_parser",
                  "precipitation_found": False,
                  "precipitation_mm": None,
                  "error": f"provider_not_supported_yet:{provider}",
              }

              return None, result, inventory

          def rebuild_inventory(incoming: list[dict]) -> list[dict]:
              by_id = {}

              for item in incoming:
                  station_id = item.get("station_id")
                  if not station_id:
                      continue
                  by_id[station_id] = item

              return sorted(
                  by_id.values(),
                  key=lambda x: (
                      x.get("institution", ""),
                      x.get("municipality") or "",
                      x.get("station_name", ""),
                  ),
              )

          def append_monthly_records(records: list[dict], gt_now: datetime) -> Path | None:
              if not records:
                  return None

              year = gt_now.strftime("%Y")
              month = gt_now.strftime("%m")

              monthly_dir = HIST_ROOT / year
              monthly_dir.mkdir(parents=True, exist_ok=True)
              monthly_path = monthly_dir / f"{year}-{month}.json"

              monthly = load_json(monthly_path, {
                  "schema": "mta_precipitaciones_mensuales_v1",
                  "year": int(year),
                  "month": int(month),
                  "records": [],
              })

              existing = monthly.get("records", [])
              new_ids = {r["record_id"] for r in records}

              filtered = [r for r in existing if r.get("record_id") not in new_ids]
              monthly["records"] = filtered + records
              monthly["updated_at_utc"] = datetime.now(timezone.utc).isoformat()
              monthly["record_count"] = len(monthly["records"])

              write_json(monthly_path, monthly)
              return monthly_path

          def write_monthly_csv(monthly_json_path: Path | None) -> Path | None:
              if monthly_json_path is None:
                  return None

              data = load_json(monthly_json_path, {"records": []})
              csv_path = monthly_json_path.with_suffix(".csv")
              records = data.get("records", [])

              fields = [
                  "record_id",
                  "observed_date",
                  "extracted_at_utc",
                  "extracted_at_gt",
                  "department",
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "variable",
                  "value",
                  "unit",
                  "aggregation_period",
                  "data_type",
                  "quality_flag",
                  "source_url",
                  "credit",
              ]

              with csv_path.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in records:
                      writer.writerow({field: row.get(field) for field in fields})

              return csv_path

