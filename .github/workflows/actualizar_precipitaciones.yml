          def now_times() -> tuple[datetime, datetime]:
              utc = datetime.now(timezone.utc)
              gt = utc.astimezone(GT)
              return utc, gt

          def normalizar(texto: str) -> str:
              texto = str(texto or "")
              texto = texto.replace("\ufeff", " ")
              texto = texto.replace("\xa0", " ")
              texto = texto.strip().lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("#", " ")
              texto = texto.replace(":", " ")
              texto = re.sub(r"\s+", " ", texto)
              return texto.strip()

          def slug(texto: str) -> str:
              limpio = normalizar(texto)
              limpio = re.sub(r"[^a-z0-9]+", "_", limpio)
              return limpio.strip("_")

          def make_station_id(institution: str, station_name: str) -> str:
              return f"{slug(institution)}_{slug(station_name)}"

          def es_solola(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia == "solola" or limpia.startswith("solola ") or " solola " in f" {limpia} "

          def es_departamento(linea: str) -> bool:
              return normalizar(linea) in DEPARTAMENTOS

          def numero_mm(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|milimetros|milímetros)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def numero_in(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:in|inch|inches)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def pulgadas_a_mm(value: float) -> float:
              return round(value * 25.4, 3)

          def fetch_url(url: str) -> tuple[str, dict]:
              headers = {
                  "User-Agent": "MTA-Solola-Precipitaciones/0.9 (+https://github.com/geograficaaala/MTA)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }

              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "ssl_mode": None,
                  "content_length": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  response.encoding = response.apparent_encoding or "utf-8"
                  status.update({
                      "ok": True,
                      "status_code": response.status_code,
                      "ssl_mode": "ssl_verificado",
                      "content_length": len(response.text),
                  })
                  return response.text, status

              except SSLError:
                  try:
                      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
                      response = requests.get(
                          url,
                          timeout=45,
                          headers=headers,
                          verify=False,
                      )
                      response.raise_for_status()
                      response.encoding = response.apparent_encoding or "utf-8"
                      status.update({
                          "ok": True,
                          "status_code": response.status_code,
                          "ssl_mode": "ssl_no_verificado_por_certificado_fuente",
                          "content_length": len(response.text),
                      })
                      return response.text, status
                  except Exception as exc:
                      status["error"] = str(exc)
                      return "", status

              except Exception as exc:
                  status["error"] = str(exc)
                  return "", status

          def html_to_soup(html: str) -> BeautifulSoup:
              soup = BeautifulSoup(html, "lxml")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              return soup

          def soup_to_lines(soup: BeautifulSoup) -> list[str]:
              return [line.strip() for line in soup.get_text("\n").splitlines() if line.strip()]

          def load_json(path: Path, default: dict) -> dict:
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def write_json(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          def load_pws_config() -> dict:
              if CONFIG_JSON.exists():
                  return load_json(CONFIG_JSON, FALLBACK_PWS_CONFIG)
              return FALLBACK_PWS_CONFIG

          def fecha_actual_rango(gt_now: datetime) -> tuple[str, str]:
              day = gt_now.strftime("%Y-%m-%d")
              return day, day

          def build_history_url(station: dict, start_date: str, end_date: str) -> str | None:
              template = station.get("history_url_template")

              if template:
                  return template.replace("{start_date}", start_date).replace("{end_date}", end_date)

              provider = station.get("provider")
              code = station.get("station_code")

              if provider == "wunderground" and code:
                  return f"https://www.wunderground.com/dashboard/pws/{code}/table/{start_date}/{end_date}/monthly"

              return station.get("provided_url") or station.get("station_url")

          def precipitation_record(
              *,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              source_id: str,
              institution: str,
              station_name: str,
              variable: str,
              value: float | int,
              unit: str,
              source_url: str,
              credit: str,
              aggregation_period: str,
              quality_flag: str = "raw_published",
          ) -> dict:
              station_id = make_station_id(institution, station_name)
              variable_slug = slug(variable)

              return {
                  "record_id": f"{observed_date}_{source_id}_{station_id}_{variable_slug}",
                  "observed_date": observed_date,
                  "extracted_at_utc": extracted_at_utc,
                  "extracted_at_gt": extracted_at_gt,
                  "department": "Sololá",
                  "station_id": station_id,
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "variable": variable,
                  "value": value,
                  "unit": unit,
                  "aggregation_period": aggregation_period,
                  "data_type": "observado_publicado",
                  "quality_flag": quality_flag,
                  "source_url": source_url,
                  "credit": credit,
              }

          def station_inventory_record(
              *,
              source_id: str,
              institution: str,
              station_name: str,
              municipality: str | None,
              status: str,
              source_url: str | None,
              credit: str,
              station_url: str | None = None,
              provider: str | None = None,
              station_code: str | None = None,
              precipitation_available: str = "por_verificar",
              online_status: str = "por_verificar",
              inventory_method: str = "extracted",
              quality_class: str = "por_verificar",
          ) -> dict:
              return {
                  "station_id": make_station_id(institution, station_name),
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "department": "Sololá",
                  "municipality": municipality,
                  "status": status,
                  "variable": "precipitation",
                  "provider": provider,
                  "station_code": station_code,
                  "precipitation_available": precipitation_available,
                  "online_status": online_status,
                  "quality_class": quality_class,
                  "source_url": source_url,
                  "station_url": station_url,
                  "inventory_method": inventory_method,
                  "credit": credit,
              }

          def buscar_dias_en_bloque(lineas: list[str]) -> tuple[int | None, int | None]:
              texto = " | ".join(normalizar(x) for x in lineas)

              con_lluvia = None
              sin_lluvia = None

              match_con = re.search(r"([0-9]+)\s*dias?\s*con\s*lluvia", texto)
              match_sin = re.search(r"([0-9]+)\s*dias?\s*sin\s*lluvia", texto)

              if match_con:
                  con_lluvia = int(match_con.group(1))
              if match_sin:
                  sin_lluvia = int(match_sin.group(1))

              return con_lluvia, sin_lluvia

          def obtener_seccion_solola(lines: list[str]) -> list[str]:
              inicio = None

              for i, line in enumerate(lines):
                  if es_solola(line):
                      inicio = i + 1
                      break

              if inicio is None:
                  raise RuntimeError("No se encontró la sección de Sololá.")

              fin = len(lines)

              for j in range(inicio, len(lines)):
                  if es_departamento(lines[j]) and not es_solola(lines[j]):
                      fin = j
                      break

              return lines[inicio:fin]

          def parse_insivumeh_precip(
              source: dict,
              html: str,
              source_url: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              observed_date: str,
          ) -> tuple[list[dict], list[dict], list[str], list[dict]]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              seccion = obtener_seccion_solola(lines)

              records = []
              stations = []
              compat_rows = []

              i = 0
              while i < len(seccion):
                  linea = seccion[i].strip()
                  siguiente = seccion[i + 1].strip() if i + 1 < len(seccion) else ""
                  valor_precip = numero_mm(siguiente)

                  if valor_precip is not None:
                      station_name = linea
                      bloque = seccion[i:i + 12]
                      rain_days, dry_days = buscar_dias_en_bloque(bloque)

                      records.append(precipitation_record(
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          variable="precipitation_accumulated",
                          value=valor_precip,
                          unit="mm",
                          aggregation_period="periodo_publicado_por_fuente",
                          source_url=source_url,
                          credit=source["credit"],
                      ))

                      if rain_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="rain_days",
                              value=rain_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      if dry_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="dry_days",
                              value=dry_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      stations.append(station_inventory_record(
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          municipality=None,
                          status="activa_por_verificar",
                          source_url=source_url,
                          station_url=None,
                          provider="insivumeh",
                          station_code=None,
                          credit=source["credit"],
                          precipitation_available="si",
                          online_status="online",
                          inventory_method="from_precipitation_page",
                          quality_class="oficial",
                      ))

                      compat_rows.append({
                          "station_id": make_station_id(source["institution"], station_name),
                          "station_name": station_name,
                          "department": "Sololá",
                          "institution": source["institution"],
                          "precipitation_mm_accumulated": valor_precip,
                          "rain_days": rain_days,
                          "dry_days": dry_days,
                          "status": "extraido",
                          "data_type": "observado_publicado",
                          "credit": source["credit"],
                      })

                      i += 2
                      continue

                  i += 1

              return records, stations, seccion, compat_rows

          def is_real_station_link(url: str) -> bool:
              clean = normalizar(url)
              return (
                  "wunderground.com/dashboard/pws/" in clean
                  or "ambientweather.net/dashboard" in clean
                  or "weatherlink.com" in clean
                  or "pwsweather" in clean
              )

          def detect_provider_and_code(url: str) -> tuple[str | None, str | None]:
              clean = url.strip()

              match_wu = re.search(r"wunderground\.com/dashboard/pws/([A-Za-z0-9_-]+)", clean, flags=re.I)
              if match_wu:
                  return "wunderground", match_wu.group(1).upper()

              if "ambientweather.net" in clean.lower():
                  return "ambientweather", None

              if "weatherlink.com" in clean.lower():
                  return "weatherlink", None

              if "pwsweather" in clean.lower():
                  return "pwsweather", None

              return None, None

          def parse_vivamos_mejor_inventory(source: dict, html: str, source_url: str) -> tuple[list[dict], list[dict], dict, str]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              raw_text = "\n".join(lines)

              all_links = []
              station_links = []

              for a in soup.find_all("a"):
                  label = a.get_text(" ", strip=True)
                  href = a.get("href")

                  if not href:
                      continue

                  full_url = urljoin(source_url, href)
                  provider, station_code = detect_provider_and_code(full_url)

                  item = {
                      "label": label,
                      "url": full_url,
                      "provider": provider,
                      "station_code": station_code,
                  }

                  all_links.append(item)

                  if is_real_station_link(full_url):
                      station_links.append(item)

              parsed = []
              i = 0

              while i < len(lines):
                  line = lines[i].strip()
                  clean = normalizar(line)

                  is_station = (
                      clean.startswith("estacion ")
                      or clean.startswith("estación ")
                      or clean.startswith("caserio ")
                      or clean.startswith("caserío ")
                  )

                  if is_station:
                      station_name = line
                      municipality = None
                      status = "por_verificar"

                      for j in range(i + 1, min(i + 7, len(lines))):
                          candidate = lines[j].strip()
                          candidate_clean = normalizar(candidate)

                          if not candidate:
                              continue

                          if "mantenimiento" in candidate_clean:
                              status = "mantenimiento"
                              break

                          if "accede aqui" in candidate_clean or "accede aquí" in candidate_clean:
                              break

                          if (
                              not candidate_clean.startswith("estacion")
                              and not candidate_clean.startswith("estación")
                              and "meteorologica" not in candidate_clean
                              and "meteorológica" not in candidate_clean
                          ):
                              municipality = candidate
                              break

                      parsed.append({
                          "station_name": station_name,
                          "municipality": municipality,
                          "status": status,
                      })

                  i += 1

              inventory_method = "extracted_from_source_page"

              if not parsed:
                  parsed = VIVAMOS_MEJOR_FALLBACK_STATIONS
                  inventory_method = "fallback_from_known_public_listing"

              stations = []

              for idx, item in enumerate(parsed):
                  link = station_links[idx] if idx < len(station_links) else None
                  station_url = link["url"] if link else None
                  provider = link["provider"] if link else None
                  station_code = link["station_code"] if link else None

                  stations.append(station_inventory_record(
                      source_id=source["source_id"],
                      institution=source["institution"],
                      station_name=item["station_name"],
                      municipality=item.get("municipality"),
                      status=item.get("status") or "por_verificar",
                      source_url=source_url,
                      station_url=station_url,
                      provider=provider,
                      station_code=station_code,
                      credit=source["credit"],
                      precipitation_available="por_verificar",
                      online_status="en_inventario",
                      inventory_method=inventory_method,
                      quality_class="institucional_local",
                  ))

              metadata = {
                  "station_count": len(stations),
                  "all_links_found": len(all_links),
                  "real_station_links_found": len(station_links),
                  "real_station_links": station_links,
                  "ignored_links": [x for x in all_links if not is_real_station_link(x["url"])],
                  "inventory_method": inventory_method,
                  "note": "Inventario institucional de Vivamos Mejor. Para datos numéricos se usa pws_config.json cuando la estación tiene URL funcional.",
              }

              return stations, station_links, metadata, raw_text

          def render_page_text_with_playwright(url: str, wait_for: str = "Precipitation") -> tuple[str, str, dict]:
              status = {
                  "url": url,
                  "ok": False,
                  "engine": "playwright_chromium",
                  "error": None,
                  "html_length": None,
                  "text_length": None,
              }

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(
                      viewport={"width": 1600, "height": 1200},
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36 MTA-Solola/0.9",
                  )

                  try:
                      page.goto(url, wait_until="networkidle", timeout=65000)

                      try:
                          page.wait_for_timeout(8000)
                          page.get_by_text(wait_for, exact=False).first.wait_for(timeout=12000)
                      except Exception:
                          pass

                      text = page.locator("body").inner_text(timeout=20000)
                      html = page.content()

                      status["ok"] = True
                      status["html_length"] = len(html)
                      status["text_length"] = len(text)

                      return text, html, status

                  except Exception as exc:
                      status["error"] = str(exc)

                      try:
                          text = page.locator("body").inner_text(timeout=5000)
                          html = page.content()
                          status["html_length"] = len(html)
                          status["text_length"] = len(text)
                          return text, html, status
                      except Exception:
                          return "", "", status

                  finally:
                      browser.close()

          def extract_wunderground_precip(text: str, html: str) -> tuple[float | None, str | None, str]:
              combined = text + "\n" + html

              patterns = [
                  r"Precipitation\s+([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Precipitation[\s\S]{0,140}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Rainfall[\s\S]{0,140}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
                  r"Rain[\s\S]{0,140}?([0-9]+(?:[.,][0-9]+)?)\s*in\b",
              ]

              for pattern in patterns:
                  match = re.search(pattern, combined, flags=re.I)
                  if match:
                      value_in = float(match.group(1).replace(",", "."))
                      return pulgadas_a_mm(value_in), match.group(0), "in_to_mm"

              mm_value = numero_mm(combined)
              if mm_value is not None and "precip" in normalizar(combined):
                  return mm_value, "precipitation_mm_detected", "mm"

              return None, None, "not_found"

          def fetch_pws_precip_with_config(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              start_date: str,
              end_date: str,
          ) -> tuple[dict | None, dict, dict]:
              provider = station.get("provider")
              station_name = station.get("station_name") or station.get("station_code") or "PWS sin nombre"
              institution = station.get("institution") or source["institution"]
              credit = station.get("credit") or source["credit"]
              station_url = station.get("station_url")
              history_url = build_history_url(station, start_date, end_date)

              inventory = station_inventory_record(
                  source_id=source["source_id"],
                  institution=institution,
                  station_name=station_name,
                  municipality=station.get("municipality"),
                  status=station.get("status") or "por_verificar",
                  source_url=history_url or station_url,
                  station_url=station_url,
                  provider=provider,
                  station_code=station.get("station_code") or station.get("dashboard_id"),
                  credit=credit,
                  precipitation_available="por_verificar",
                  online_status="por_verificar",
                  inventory_method="pws_config_json",
                  quality_class=station.get("quality_class") or "complementaria",
              )

              result = {
                  "station_id": inventory["station_id"],
                  "station_name": station_name,
                  "provider": provider,
                  "station_code": station.get("station_code"),
                  "dashboard_id": station.get("dashboard_id"),
                  "station_url": station_url,
                  "history_url": history_url,
                  "enabled": station.get("enabled", True),
                  "enabled_current_extraction": station.get("enabled_current_extraction", True),
                  "enabled_historical_extraction": station.get("enabled_historical_extraction", False),
                  "ok": False,
                  "online_status": "por_verificar",
                  "precipitation_found": False,
                  "precipitation_mm": None,
                  "error": None,
                  "matched_text": None,
                  "unit_conversion": None,
              }

              if not station.get("enabled", True):
                  result["online_status"] = "deshabilitada"
                  result["error"] = "station_disabled"
                  inventory["online_status"] = "deshabilitada"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              if not station.get("enabled_current_extraction", True):
                  if station.get("enabled_historical_extraction"):
                      result["online_status"] = "historica_no_actual"
                      result["error"] = "current_extraction_disabled_historical_only"
                      inventory["online_status"] = "historica"
                      inventory["precipitation_available"] = "historica_por_verificar"
                  else:
                      result["online_status"] = "requiere_parser_o_configuracion"
                      result["error"] = "current_extraction_disabled"
                      inventory["online_status"] = "requiere_parser"
                      inventory["precipitation_available"] = "por_verificar"

                  return None, result, inventory

              if provider != "wunderground":
                  result["online_status"] = "requiere_parser"
                  result["error"] = f"provider_not_supported_yet:{provider}"
                  inventory["online_status"] = "requiere_parser"
                  inventory["precipitation_available"] = "por_verificar"
                  return None, result, inventory

              if not history_url:
                  result["online_status"] = "sin_url"
                  result["error"] = "missing_history_url"
                  inventory["online_status"] = "sin_url"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

              try:
                  text, html, render_status = render_page_text_with_playwright(history_url)
                  result["render_status"] = render_status

                  raw_file = RAW_ROOT / f"wunderground_{slug(station_name)}_{observed_date}.txt"
                  raw_file.write_text(text[:20000], encoding="utf-8")
                  result["raw_text_path"] = str(raw_file)

                  if not render_status["ok"] and not text:
                      result["online_status"] = "offline_o_no_render"
                      result["error"] = render_status.get("error") or "render_failed"
                      inventory["online_status"] = "offline_o_no_render"
                      inventory["precipitation_available"] = "no"
                      return None, result, inventory

                  value_mm, matched, conversion = extract_wunderground_precip(text, html)

                  result["ok"] = True

                  if value_mm is None:
                      result["online_status"] = "online_sin_dato_detectado"
                      result["error"] = "precipitacion_no_detectada_en_tabla_renderizada"
                      inventory["online_status"] = "online_sin_dato_detectado"
                      inventory["precipitation_available"] = "por_verificar"
                      return None, result, inventory

                  result["online_status"] = "online"
                  result["precipitation_found"] = True
                  result["precipitation_mm"] = value_mm
                  result["matched_text"] = matched
                  result["unit_conversion"] = conversion

                  inventory["online_status"] = "online"
                  inventory["precipitation_available"] = "si_extraida"

                  record = precipitation_record(
                      observed_date=observed_date,
                      extracted_at_utc=extracted_at_utc,
                      extracted_at_gt=extracted_at_gt,
                      source_id=source["source_id"],
                      institution=institution,
                      station_name=station_name,
                      variable="precipitation_accumulated",
                      value=value_mm,
                      unit="mm",
                      aggregation_period=f"wunderground_table:{start_date}_to_{end_date}",
                      source_url=history_url,
                      credit=credit,
                      quality_flag="pws_complementaria_rendered_table",
                  )

                  return record, result, inventory

              except Exception as exc:
                  result["online_status"] = "error"
                  result["error"] = str(exc)
                  inventory["online_status"] = "error"
                  inventory["precipitation_available"] = "no"
                  return None, result, inventory

          def merge_inventory(existing: list[dict], incoming: list[dict]) -> list[dict]:
              by_id = {item["station_id"]: item for item in existing if item.get("station_id")}
              for item in incoming:
                  by_id[item["station_id"]] = item
              return sorted(by_id.values(), key=lambda x: (x.get("institution", ""), x.get("station_name", "")))

          def append_monthly_records(records: list[dict], gt_now: datetime) -> Path | None:
              if not records:
                  return None

              year = gt_now.strftime("%Y")
              month = gt_now.strftime("%m")

              monthly_dir = HIST_ROOT / year
              monthly_dir.mkdir(parents=True, exist_ok=True)
              monthly_path = monthly_dir / f"{year}-{month}.json"

              monthly = load_json(monthly_path, {
                  "schema": "mta_precipitaciones_mensuales_v1",
                  "year": int(year),
                  "month": int(month),
                  "records": [],
              })

              existing = monthly.get("records", [])
              new_ids = {r["record_id"] for r in records}

              filtered = [r for r in existing if r.get("record_id") not in new_ids]
              monthly["records"] = filtered + records
              monthly["updated_at_utc"] = datetime.now(timezone.utc).isoformat()
              monthly["record_count"] = len(monthly["records"])

              write_json(monthly_path, monthly)
              return monthly_path

          def write_monthly_csv(monthly_json_path: Path | None) -> Path | None:
              if monthly_json_path is None:
                  return None

              data = load_json(monthly_json_path, {"records": []})
              csv_path = monthly_json_path.with_suffix(".csv")
              records = data.get("records", [])

              fields = [
                  "record_id",
                  "observed_date",
                  "extracted_at_utc",
                  "extracted_at_gt",
                  "department",
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "variable",
                  "value",
                  "unit",
                  "aggregation_period",
                  "data_type",
                  "quality_flag",
                  "source_url",
                  "credit",
              ]

              with csv_path.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in records:
                      writer.writerow({field: row.get(field) for field in fields})

              return csv_path

          def write_inventory_csv(stations: list[dict]) -> None:
              fields = [
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "department",
                  "municipality",
                  "status",
                  "variable",
                  "provider",
                  "station_code",
                  "precipitation_available",
                  "online_status",
                  "quality_class",
                  "source_url",
                  "station_url",
                  "inventory_method",
                  "credit",
              ]

              with INVENTARIO_CSV.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in stations:
                      writer.writerow({field: row.get(field) for field in fields})

          utc_now, gt_now = now_times()
          extracted_at_utc = utc_now.isoformat()
          extracted_at_gt = gt_now.isoformat()
          observed_date = gt_now.strftime("%Y-%m-%d")
          start_date, end_date = fecha_actual_rango(gt_now)

          pws_config = load_pws_config()

          all_records = []
          all_inventory = []
          source_status = []

          insivumeh_compat_rows = []
          insivumeh_raw_section = []

          vivamos_mejor_inventory = []
          vivamos_mejor_metadata = {}
          vivamos_mejor_raw_text = ""

          pws_inventory = []
          pws_results = []

          for source in SOURCES:
              status = {
                  "source_id": source["source_id"],
                  "institution": source["institution"],
                  "parser": source["parser"],
                  "checked_at_utc": extracted_at_utc,
                  "checked_at_gt": extracted_at_gt,
                  "ok": False,
                  "records_added": 0,
                  "stations_found": 0,
                  "urls": [],
                  "errors": [],
              }

              if source["parser"] == "insivumeh_solola":
                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if not fetch_status["ok"]:
                          status["errors"].append(f"{url}: {fetch_status.get('error')}")
                          continue

                      try:
                          records, stations, raw_section, compat_rows = parse_insivumeh_precip(
                              source,
                              html,
                              url,
                              extracted_at_utc,
                              extracted_at_gt,
                              observed_date,
                          )

                          if records:
                              all_records.extend(records)
                              all_inventory.extend(stations)
                              insivumeh_raw_section = raw_section
                              insivumeh_compat_rows = compat_rows
                              status["ok"] = True
                              status["records_added"] = len(records)
                              status["stations_found"] = len(stations)
                              break

                      except Exception as exc:
                          status["errors"].append(f"{url}: {exc}")

              elif source["parser"] == "vivamos_mejor_inventory":
                  html = ""
                  page_url = source["urls"][0]

                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if fetch_status["ok"]:
                          page_url = url
                          break

                      status["errors"].append(f"{url}: {fetch_status.get('error')}")

                  if html:
                      try:
                          stations, station_links, metadata, raw_text = parse_vivamos_mejor_inventory(
                              source,
                              html,
                              page_url,
                          )

                          vivamos_mejor_inventory = stations
                          vivamos_mejor_metadata = metadata
                          vivamos_mejor_raw_text = raw_text
                          status["ok"] = True
                          status["stations_found"] = len(stations)

                      except Exception as exc:
                          status["errors"].append(f"parse_inventory: {exc}")

                  if not vivamos_mejor_inventory:
                      vivamos_mejor_inventory = [
                          station_inventory_record(
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=item["station_name"],
                              municipality=item.get("municipality"),
                              status=item.get("status") or "por_verificar",
                              source_url=source["urls"][0],
                              station_url=None,
                              provider=None,
                              station_code=None,
                              credit=source["credit"],
                              precipitation_available="por_verificar",
                              online_status="en_inventario",
                              inventory_method="fallback_from_known_public_listing",
                              quality_class="institucional_local",
                          )
                          for item in VIVAMOS_MEJOR_FALLBACK_STATIONS
                      ]

                      vivamos_mejor_metadata = {
                          "station_count": len(vivamos_mejor_inventory),
                          "inventory_method": "fallback_from_known_public_listing",
                          "real_station_links_found": 0,
                      }

                      status["ok"] = True
                      status["stations_found"] = len(vivamos_mejor_inventory)

                  all_inventory.extend(vivamos_mejor_inventory)

              elif source["parser"] == "pws_config":
                  stations_config = [
                      station for station in pws_config.get("stations", [])
                      if station.get("enabled", True)
                  ]

                  for station in stations_config:
                      record, station_result, inventory_item = fetch_pws_precip_with_config(
                          station=station,
                          source=source,
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                          start_date=start_date,
                          end_date=end_date,
                      )

                      pws_results.append(station_result)
                      pws_inventory.append(inventory_item)

                      if record:
                          all_records.append(record)
                          status["records_added"] += 1

                  all_inventory.extend(pws_inventory)

                  status["ok"] = True
                  status["stations_found"] = len(pws_inventory)
                  status["urls"] = [
                      {
                          "url": item.get("history_url") or item.get("station_url"),
                          "ok": item.get("ok"),
                          "online_status": item.get("online_status"),
                          "provider": item.get("provider"),
                          "station_code": item.get("station_code"),
                          "error": item.get("error"),
                      }
                      for item in pws_results
                  ]

              source_status.append(status)

          monthly_path = append_monthly_records(all_records, gt_now)
          monthly_csv = write_monthly_csv(monthly_path)

          existing_inventory = load_json(INVENTARIO_JSON, {
              "schema": "mta_precipitacion_estaciones_v1",
              "stations": [],
          })

          merged_inventory = merge_inventory(
              existing_inventory.get("stations", []),
              all_inventory,
          )

          actual_payload = {
              "schema": "mta_precipitaciones_actuales_v4",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "observed_date": observed_date,
              "department": "Sololá",
              "policy": {
                  "storage": "actual_json_mas_historico_mensual",
                  "only_precipitation": True,
                  "do_not_average_raw_stations": True,
                  "included_sources": [
                      "INSIVUMEH",
                      "Asociación Vivamos Mejor",
                      "PWS configuradas manualmente",
                  ],
                  "excluded_sources_for_now": [
                      "AMSCLAE",
                  ],
                  "note": "Las observaciones de precipitación se conservan por estación, institución, proveedor, variable, fecha y fuente. Promedios o mapas se harán como productos derivados separados.",
              },
              "latest_records": all_records,
              "monthly_history": str(monthly_path) if monthly_path else None,
              "monthly_history_csv": str(monthly_csv) if monthly_csv else None,
              "station_inventory_path": str(INVENTARIO_JSON),
              "source_status_path": str(SOURCE_STATUS_JSON),
              "pws_config_path": str(CONFIG_JSON),
          }

          write_json(ACTUAL_JSON, actual_payload)

          write_json(SOURCE_STATUS_JSON, {
              "schema": "mta_precipitacion_source_status_v4",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "sources": source_status,
          })

          inventory_payload = {
              "schema": "mta_precipitacion_estaciones_v4",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "station_count": len(merged_inventory),
              "stations": merged_inventory,
          }

          write_json(INVENTARIO_JSON, inventory_payload)
          write_inventory_csv(merged_inventory)

          write_json(INSIVUMEH_COMPAT_JSON, {
              "schema": "mta_precipitaciones_insivumeh_actual_v4",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "INSIVUMEH",
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "stations": insivumeh_compat_rows,
          })

          INSIVUMEH_RAW_TXT.write_text("\n".join(insivumeh_raw_section), encoding="utf-8")

          with INSIVUMEH_COMPAT_CSV.open("w", encoding="utf-8", newline="") as f:
              fields = [
                  "station_id",
                  "station_name",
                  "department",
                  "institution",
                  "precipitation_mm_accumulated",
                  "rain_days",
                  "dry_days",
                  "status",
                  "data_type",
                  "credit",
              ]
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(insivumeh_compat_rows)

          write_json(VIVAMOS_MEJOR_JSON, {
              "schema": "mta_precipitaciones_vivamos_mejor_v4",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "Asociación Vivamos Mejor",
                  "url": SOURCES[1]["urls"][0],
                  "credit": SOURCES[1]["credit"],
              },
              "metadata": vivamos_mejor_metadata,
              "stations": vivamos_mejor_inventory,
              "notes": [
                  "Vivamos Mejor se conserva como inventario institucional local.",
                  "La extracción numérica de las PWS se maneja mediante pws_config.json.",
                  "Solo se trabaja precipitación en esta etapa.",
              ],
          })

          VIVAMOS_MEJOR_RAW_TXT.write_text(vivamos_mejor_raw_text, encoding="utf-8")

          write_json(PWS_JSON, {
              "schema": "mta_precipitaciones_pws_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "PWS configuradas manualmente",
                  "config_path": str(CONFIG_JSON),
                  "credit": "Datos: estación meteorológica complementaria pública. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "date_range_used": {
                  "start_date": start_date,
                  "end_date": end_date,
              },
              "stations": pws_inventory,
              "station_extraction_results": pws_results,
              "notes": [
                  "Se usa pws_config.json como lista blanca manual.",
                  "Weather Underground se procesa con Chromium/Playwright porque la tabla puede cargar con JavaScript.",
                  "Ambient Weather queda registrado como estación configurada, pero requiere parser específico.",
                  "No se promedian datos crudos.",
              ],
          })

          print(f"OK registros numéricos de precipitación: {len(all_records)}")
          print(f"OK inventario consolidado de estaciones de precipitación: {len(merged_inventory)}")
          print(f"INSIVUMEH filas compatibilidad: {len(insivumeh_compat_rows)}")
          print(f"Vivamos Mejor estaciones inventario: {len(vivamos_mejor_inventory)}")
          print(f"PWS configuradas: {len(pws_inventory)}")
          print(f"Actual: {ACTUAL_JSON}")
          print(f"Inventario: {INVENTARIO_JSON}")
          print(f"Histórico mensual: {monthly_path}")
          print(f"PWS: {PWS_JSON}")

      - name: Guardar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/precipitaciones/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en precipitaciones."
          else
            git commit -m "Actualizar precipitaciones"
            git push
          fi
