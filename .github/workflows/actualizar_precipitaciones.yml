name: Actualizar precipitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  actualizar-precipitaciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml certifi urllib3

      - name: Extraer precipitaciones
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin
          from zoneinfo import ZoneInfo

          import certifi
          import requests
          import urllib3
          from bs4 import BeautifulSoup
          from requests.exceptions import SSLError

          GT = ZoneInfo("America/Guatemala")

          DATA_ROOT = Path("docs/data/precipitaciones")
          HIST_ROOT = DATA_ROOT / "historico"
          RAW_ROOT = DATA_ROOT / "raw"

          DATA_ROOT.mkdir(parents=True, exist_ok=True)
          HIST_ROOT.mkdir(parents=True, exist_ok=True)
          RAW_ROOT.mkdir(parents=True, exist_ok=True)

          ACTUAL_JSON = DATA_ROOT / "actual.json"
          SOURCE_STATUS_JSON = DATA_ROOT / "source_status.json"

          INVENTARIO_JSON = DATA_ROOT / "estaciones_precipitacion.json"
          INVENTARIO_CSV = DATA_ROOT / "estaciones_precipitacion.csv"

          INSIVUMEH_COMPAT_JSON = DATA_ROOT / "insivumeh_solola.json"
          INSIVUMEH_COMPAT_CSV = DATA_ROOT / "insivumeh_solola.csv"
          INSIVUMEH_RAW_TXT = DATA_ROOT / "insivumeh_solola_raw.txt"

          VIVAMOS_MEJOR_JSON = DATA_ROOT / "vivamos_mejor_precipitacion.json"
          VIVAMOS_MEJOR_RAW_TXT = DATA_ROOT / "vivamos_mejor_raw.txt"

          AMSCLAE_JSON = DATA_ROOT / "amsclae_precipitacion.json"
          AMSCLAE_RAW_TXT = DATA_ROOT / "amsclae_raw.txt"

          SOURCES = [
              {
                  "source_id": "insivumeh_precipitaciones_departamentos",
                  "institution": "INSIVUMEH",
                  "parser": "insivumeh_solola",
                  "urls": [
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Departamentos.html",
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Cronologico.html",
                  ],
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "vivamos_mejor_estaciones",
                  "institution": "Asociación Vivamos Mejor",
                  "parser": "vivamos_mejor_precip",
                  "urls": [
                      "https://www.vivamosmejor.org.gt/sitio/estaciones-meteorologicas-solola/",
                  ],
                  "credit": "Datos: Asociación Vivamos Mejor. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "amsclae_estaciones_climaticas",
                  "institution": "AMSCLAE",
                  "parser": "amsclae_precip",
                  "urls": [
                      "https://www.amsclae.gob.gt/clima/estacion-climatica.php",
                      "https://www.amsclae.gob.gt/clima/",
                      "https://www.amsclae.gob.gt/2024/04/09/mantenimiento-de-las-estaciones-meteorologicas/",
                  ],
                  "credit": "Datos: AMSCLAE. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
          ]

          VIVAMOS_MEJOR_FALLBACK_STATIONS = [
              {"station_name": "Estación Oficina Central", "municipality": "Panajachel", "status": "por_verificar"},
              {"station_name": "Estación Casa Santa Rita", "municipality": "Santa Lucía Utatlán", "status": "por_verificar"},
              {"station_name": "Estación CoAtitlán R.L.", "municipality": "Santiago Atitlán", "status": "por_verificar"},
              {"station_name": "Estación Lomas de Atitlán", "municipality": "San Andrés Semetabaj", "status": "por_verificar"},
              {"station_name": "Estación CEDRACC", "municipality": "Santa Cruz La Laguna", "status": "por_verificar"},
              {"station_name": "Estación Santa Clara TV Cable", "municipality": "Santa Clara La Laguna", "status": "por_verificar"},
              {"station_name": "Caserío Chuacruz", "municipality": "Aldea Pujujil I, Sololá", "status": "mantenimiento"},
              {"station_name": "Estación Escuela de Formación Agrícola", "municipality": "Sololá", "status": "por_verificar"},
          ]

          AMSCLAE_STATION_FALLBACK = [
              "Barraneche",
              "Cerro de Oro",
              "Concepcion",
              "El Tablon",
              "Finca Santa Victoria",
              "Los Saminez",
              "Nahuala",
              "Pamesebal",
              "Panajachel",
              "San Andres Semetabaj",
              "San Antonio Palopo",
              "San Jose Chacaya",
              "San Juan La Laguna",
              "San Lucas Toliman",
              "San Marcos La Laguna",
              "Santa Catarina Palopo",
              "Santa Cruz La Laguna",
              "Santa Lucia Utatlan",
              "Santa Maria Visitacion",
              "Santa Rita Nahuala",
              "Santiago Atitlan",
              "Solola",
          ]

          DEPARTAMENTOS = [
              "alta verapaz",
              "baja verapaz",
              "chimaltenango",
              "chiquimula",
              "el progreso",
              "escuintla",
              "guatemala",
              "huehuetenango",
              "izabal",
              "jalapa",
              "jutiapa",
              "peten",
              "quetzaltenango",
              "quiche",
              "retalhuleu",
              "sacatepequez",
              "san marcos",
              "santa rosa",
              "solola",
              "suchitepequez",
              "totonicapan",
              "zacapa",
              "region norte",
          ]

          EXCLUDE_OPTION_WORDS = {
              "seleccione",
              "seleccione estacion",
              "seleccione estación",
              "periodo",
              "período",
              "diario",
              "mensual",
              "generar",
              "temperatura med",
              "temperatura min",
              "temperatura max",
              "precipitacion",
              "precipitación",
              "humedad",
              "radiacion solar",
              "radiación solar",
              "rad solar max abs",
              "indice uv max abs",
              "índice uv max abs",
          }

          def now_times() -> tuple[datetime, datetime]:
              utc = datetime.now(timezone.utc)
              gt = utc.astimezone(GT)
              return utc, gt

          def normalizar(texto: str) -> str:
              texto = str(texto or "")
              texto = texto.replace("\ufeff", " ")
              texto = texto.replace("\xa0", " ")
              texto = texto.strip().lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("#", " ")
              texto = texto.replace(":", " ")
              texto = re.sub(r"\s+", " ", texto)
              return texto.strip()

          def slug(texto: str) -> str:
              limpio = normalizar(texto)
              limpio = re.sub(r"[^a-z0-9]+", "_", limpio)
              return limpio.strip("_")

          def make_station_id(institution: str, station_name: str) -> str:
              return f"{slug(institution)}_{slug(station_name)}"

          def es_solola(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia == "solola" or limpia.startswith("solola ") or " solola " in f" {limpia} "

          def es_departamento(linea: str) -> bool:
              return normalizar(linea) in DEPARTAMENTOS

          def numero_mm(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|milimetros|milímetros)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def buscar_dias_en_bloque(lineas: list[str]) -> tuple[int | None, int | None]:
              texto = " | ".join(normalizar(x) for x in lineas)

              con_lluvia = None
              sin_lluvia = None

              match_con = re.search(r"([0-9]+)\s*dias?\s*con\s*lluvia", texto)
              match_sin = re.search(r"([0-9]+)\s*dias?\s*sin\s*lluvia", texto)

              if match_con:
                  con_lluvia = int(match_con.group(1))
              if match_sin:
                  sin_lluvia = int(match_sin.group(1))

              return con_lluvia, sin_lluvia

          def fetch_url(url: str) -> tuple[str, dict]:
              headers = {
                  "User-Agent": "MTA-Solola-Precipitaciones/0.7 (+https://github.com/geograficaaala/MTA)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }

              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "ssl_mode": None,
                  "content_length": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  response.encoding = response.apparent_encoding or "utf-8"
                  status.update({
                      "ok": True,
                      "status_code": response.status_code,
                      "ssl_mode": "ssl_verificado",
                      "content_length": len(response.text),
                  })
                  return response.text, status

              except SSLError:
                  try:
                      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
                      response = requests.get(
                          url,
                          timeout=45,
                          headers=headers,
                          verify=False,
                      )
                      response.raise_for_status()
                      response.encoding = response.apparent_encoding or "utf-8"
                      status.update({
                          "ok": True,
                          "status_code": response.status_code,
                          "ssl_mode": "ssl_no_verificado_por_certificado_fuente",
                          "content_length": len(response.text),
                      })
                      return response.text, status
                  except Exception as exc:
                      status["error"] = str(exc)
                      return "", status

              except Exception as exc:
                  status["error"] = str(exc)
                  return "", status

          def html_to_soup(html: str) -> BeautifulSoup:
              soup = BeautifulSoup(html, "lxml")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              return soup

          def soup_to_lines(soup: BeautifulSoup) -> list[str]:
              return [line.strip() for line in soup.get_text("\n").splitlines() if line.strip()]

          def load_json(path: Path, default: dict) -> dict:
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def write_json(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          def precipitation_record(
              *,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              source_id: str,
              institution: str,
              station_name: str,
              variable: str,
              value: float | int,
              unit: str,
              source_url: str,
              credit: str,
              aggregation_period: str,
              quality_flag: str = "raw_published",
          ) -> dict:
              station_id = make_station_id(institution, station_name)
              variable_slug = slug(variable)

              return {
                  "record_id": f"{observed_date}_{source_id}_{station_id}_{variable_slug}",
                  "observed_date": observed_date,
                  "extracted_at_utc": extracted_at_utc,
                  "extracted_at_gt": extracted_at_gt,
                  "department": "Sololá",
                  "station_id": station_id,
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "variable": variable,
                  "value": value,
                  "unit": unit,
                  "aggregation_period": aggregation_period,
                  "data_type": "observado_publicado",
                  "quality_flag": quality_flag,
                  "source_url": source_url,
                  "credit": credit,
              }

          def station_inventory_record(
              *,
              source_id: str,
              institution: str,
              station_name: str,
              municipality: str | None,
              status: str,
              source_url: str,
              credit: str,
              station_url: str | None = None,
              precipitation_available: str = "por_verificar",
              inventory_method: str = "extracted",
          ) -> dict:
              return {
                  "station_id": make_station_id(institution, station_name),
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "department": "Sololá",
                  "municipality": municipality,
                  "status": status,
                  "variable": "precipitation",
                  "precipitation_available": precipitation_available,
                  "source_url": source_url,
                  "station_url": station_url,
                  "inventory_method": inventory_method,
                  "credit": credit,
              }

          def obtener_seccion_solola(lines: list[str]) -> list[str]:
              inicio = None

              for i, line in enumerate(lines):
                  if es_solola(line):
                      inicio = i + 1
                      break

              if inicio is None:
                  raise RuntimeError("No se encontró la sección de Sololá.")

              fin = len(lines)

              for j in range(inicio, len(lines)):
                  if es_departamento(lines[j]) and not es_solola(lines[j]):
                      fin = j
                      break

              return lines[inicio:fin]

          def parse_insivumeh_precip(
              source: dict,
              html: str,
              source_url: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              observed_date: str,
          ) -> tuple[list[dict], list[dict], list[str], list[dict]]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              seccion = obtener_seccion_solola(lines)

              records = []
              stations = []
              compat_rows = []

              i = 0
              while i < len(seccion):
                  linea = seccion[i].strip()
                  siguiente = seccion[i + 1].strip() if i + 1 < len(seccion) else ""
                  valor_precip = numero_mm(siguiente)

                  if valor_precip is not None:
                      station_name = linea
                      bloque = seccion[i:i + 12]
                      rain_days, dry_days = buscar_dias_en_bloque(bloque)

                      records.append(precipitation_record(
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          variable="precipitation_accumulated",
                          value=valor_precip,
                          unit="mm",
                          aggregation_period="periodo_publicado_por_fuente",
                          source_url=source_url,
                          credit=source["credit"],
                      ))

                      if rain_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="rain_days",
                              value=rain_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      if dry_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="dry_days",
                              value=dry_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      stations.append(station_inventory_record(
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          municipality=None,
                          status="activa_por_verificar",
                          source_url=source_url,
                          station_url=None,
                          credit=source["credit"],
                          precipitation_available="si",
                          inventory_method="from_precipitation_page",
                      ))

                      compat_rows.append({
                          "station_id": make_station_id(source["institution"], station_name),
                          "station_name": station_name,
                          "department": "Sololá",
                          "institution": source["institution"],
                          "precipitation_mm_accumulated": valor_precip,
                          "rain_days": rain_days,
                          "dry_days": dry_days,
                          "status": "extraido",
                          "data_type": "observado_publicado",
                          "credit": source["credit"],
                      })

                      i += 2
                      continue

                  i += 1

              return records, stations, seccion, compat_rows

          def is_real_station_link(url: str) -> bool:
              clean = normalizar(url)
              return (
                  "wunderground.com/dashboard/pws/" in clean
                  or "ambientweather.net/dashboard" in clean
                  or "weatherlink.com" in clean
                  or "pwsweather" in clean
              )

          def parse_vivamos_mejor_inventory(source: dict, html: str, source_url: str) -> tuple[list[dict], list[dict], dict, str]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              raw_text = "\n".join(lines)

              all_links = []
              station_links = []

              for a in soup.find_all("a"):
                  label = a.get_text(" ", strip=True)
                  href = a.get("href")
                  if not href:
                      continue

                  full_url = urljoin(source_url, href)
                  item = {"label": label, "url": full_url}
                  all_links.append(item)

                  if is_real_station_link(full_url):
                      station_links.append(item)

              parsed = []
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  clean = normalizar(line)

                  is_station = (
                      clean.startswith("estacion ")
                      or clean.startswith("estación ")
                      or clean.startswith("caserio ")
                      or clean.startswith("caserío ")
                  )

                  if is_station:
                      station_name = line
                      municipality = None
                      status = "por_verificar"

                      for j in range(i + 1, min(i + 7, len(lines))):
                          candidate = lines[j].strip()
                          candidate_clean = normalizar(candidate)

                          if not candidate:
                              continue

                          if "mantenimiento" in candidate_clean:
                              status = "mantenimiento"
                              break

                          if "accede aqui" in candidate_clean or "accede aquí" in candidate_clean:
                              break

                          if (
                              not candidate_clean.startswith("estacion")
                              and not candidate_clean.startswith("estación")
                              and "meteorologica" not in candidate_clean
                              and "meteorológica" not in candidate_clean
                          ):
                              municipality = candidate
                              break

                      parsed.append({
                          "station_name": station_name,
                          "municipality": municipality,
                          "status": status,
                      })

                  i += 1

              inventory_method = "extracted_from_source_page"
              if not parsed:
                  parsed = VIVAMOS_MEJOR_FALLBACK_STATIONS
                  inventory_method = "fallback_from_known_public_listing"

              stations = []
              for idx, item in enumerate(parsed):
                  station_url = station_links[idx]["url"] if idx < len(station_links) else None
                  stations.append(station_inventory_record(
                      source_id=source["source_id"],
                      institution=source["institution"],
                      station_name=item["station_name"],
                      municipality=item.get("municipality"),
                      status=item.get("status") or "por_verificar",
                      source_url=source_url,
                      station_url=station_url,
                      credit=source["credit"],
                      precipitation_available="por_verificar",
                      inventory_method=inventory_method,
                  ))

              metadata = {
                  "station_count": len(stations),
                  "all_links_found": len(all_links),
                  "real_station_links_found": len(station_links),
                  "real_station_links": station_links,
                  "ignored_links": [x for x in all_links if not is_real_station_link(x["url"])],
                  "inventory_method": inventory_method,
                  "note": "Se ignoran enlaces genéricos. Solo se usan enlaces reales de estación como Wunderground, Ambient Weather o WeatherLink.",
              }

              return stations, station_links, metadata, raw_text

          def extract_precip_from_station_page(text: str) -> tuple[float | None, str | None]:
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              keywords = [
                  "precipitacion",
                  "precipitación",
                  "lluvia",
                  "rain",
                  "rainfall",
                  "rain rate",
                  "rain today",
                  "daily rain",
                  "precip",
              ]

              for i, line in enumerate(lines):
                  clean = normalizar(line)
                  if not any(normalizar(k) in clean for k in keywords):
                      continue

                  block = " | ".join(lines[max(0, i - 2): min(len(lines), i + 5)])
                  value = numero_mm(block)

                  if value is not None:
                      return value, block

              keyword_pattern = r"(precipitaci[oó]n|lluvia|rain|rainfall|rain today|daily rain|precip)"
              match = re.search(
                  keyword_pattern + r".{0,160}?([0-9]+(?:[.,][0-9]+)?)\s*mm",
                  text,
                  flags=re.I | re.S,
              )

              if match:
                  return float(match.group(2).replace(",", ".")), match.group(0)

              return None, None

          def fetch_station_precip(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
          ) -> tuple[dict | None, dict]:
              station_url = station.get("station_url")

              result = {
                  "station_id": station["station_id"],
                  "station_name": station["station_name"],
                  "station_url": station_url,
                  "ok": False,
                  "precipitation_found": False,
                  "error": None,
                  "matched_text": None,
              }

              if not station_url:
                  result["error"] = "sin_url_de_estacion"
                  return None, result

              html, status = fetch_url(station_url)
              result["fetch_status"] = status

              if not status["ok"]:
                  result["error"] = status.get("error") or "no_response"
                  return None, result

              soup = html_to_soup(html)
              text = soup.get_text("\n")
              value, matched = extract_precip_from_station_page(text + "\n" + html)

              if value is None:
                  result["ok"] = True
                  result["error"] = "precipitacion_no_detectada_en_html"
                  return None, result

              result["ok"] = True
              result["precipitation_found"] = True
              result["matched_text"] = matched

              record = precipitation_record(
                  observed_date=observed_date,
                  extracted_at_utc=extracted_at_utc,
                  extracted_at_gt=extracted_at_gt,
                  source_id=source["source_id"],
                  institution=source["institution"],
                  station_name=station["station_name"],
                  variable="precipitation_accumulated",
                  value=value,
                  unit="mm",
                  aggregation_period="periodo_publicado_por_fuente",
                  source_url=station_url,
                  credit=source["credit"],
                  quality_flag="raw_published_detected_from_station_page",
              )

              return record, result

          def parse_amsclae_precip_inventory(source: dict, pages: list[dict]) -> tuple[list[dict], dict, str]:
              all_lines = []
              raw_parts = []
              station_candidates = []
              parameter_candidates = []
              forms = []
              links = []

              for page in pages:
                  html = page.get("html") or ""
                  url = page.get("url")
                  if not html:
                      continue

                  soup = html_to_soup(html)
                  lines = soup_to_lines(soup)
                  all_lines.extend(lines)
                  raw_parts.append(f"\n\n===== {url} =====\n" + "\n".join(lines))

                  for form in soup.find_all("form"):
                      forms.append({
                          "source_url": url,
                          "method": (form.get("method") or "GET").upper(),
                          "action": urljoin(url, form.get("action") or ""),
                          "inputs": [
                              {
                                  "name": input_tag.get("name"),
                                  "id": input_tag.get("id"),
                                  "type": input_tag.get("type"),
                                  "value": input_tag.get("value"),
                              }
                              for input_tag in form.find_all(["input", "select", "button"])
                          ],
                      })

                  for option in soup.find_all("option"):
                      text = option.get_text(" ", strip=True)
                      value = option.get("value")
                      clean = normalizar(text)

                      if not text:
                          continue

                      if clean in EXCLUDE_OPTION_WORDS:
                          continue

                      if any(word in clean for word in ["temperatura", "humedad", "radiacion", "uv", "precipitacion"]):
                          parameter_candidates.append({"text": text, "value": value, "source_url": url})
                          continue

                      if len(text) >= 3:
                          station_candidates.append({"name": text, "value": value, "source_url": url})

                  for a in soup.find_all("a"):
                      href = a.get("href")
                      text = a.get_text(" ", strip=True)
                      if href:
                          full = urljoin(url, href)
                          clean = normalizar(text + " " + full)
                          if any(word in clean for word in ["clima", "precipitacion", "precipitación", "estacion", "meteorologica", "informe"]):
                              links.append({"text": text, "url": full})

              text_all = "\n".join(all_lines)
              has_precipitation_parameter = "precipitación" in text_all.lower() or "precipitacion" in normalizar(text_all)

              clean_station_names = []
              seen = set()

              for item in station_candidates:
                  name = item["name"].strip()
                  key = slug(name)

                  if not key:
                      continue

                  if key in seen:
                      continue

                  if normalizar(name) in EXCLUDE_OPTION_WORDS:
                      continue

                  seen.add(key)
                  clean_station_names.append(name)

              if len(clean_station_names) < 5:
                  clean_station_names = AMSCLAE_STATION_FALLBACK

              stations = [
                  station_inventory_record(
                      source_id=source["source_id"],
                      institution=source["institution"],
                      station_name=name,
                      municipality=name,
                      status="por_verificar",
                      source_url=source["urls"][0],
                      station_url=None,
                      credit=source["credit"],
                      precipitation_available="parametro_precipitacion_disponible" if has_precipitation_parameter else "por_verificar",
                      inventory_method="amsclae_climate_form_options",
                  )
                  for name in clean_station_names
              ]

              metadata = {
                  "station_count": len(stations),
                  "has_precipitation_parameter": has_precipitation_parameter,
                  "forms_found": forms,
                  "relevant_links": links,
                  "parameter_candidates": parameter_candidates,
                  "notes": [
                      "AMSCLAE se integra por ahora como inventario de estaciones de precipitación.",
                      "La página pública expone el parámetro Precipitación, pero no se detectó todavía una tabla numérica directa en HTML.",
                      "El siguiente paso será identificar el endpoint del formulario para extraer valores históricos o mensuales.",
                  ],
              }

              return stations, metadata, "\n".join(raw_parts)

          def merge_inventory(existing: list[dict], incoming: list[dict]) -> list[dict]:
              by_id = {item["station_id"]: item for item in existing if item.get("station_id")}
              for item in incoming:
                  by_id[item["station_id"]] = item
              return sorted(by_id.values(), key=lambda x: (x.get("institution", ""), x.get("station_name", "")))

          def append_monthly_records(records: list[dict], gt_now: datetime) -> Path | None:
              if not records:
                  return None

              year = gt_now.strftime("%Y")
              month = gt_now.strftime("%m")

              monthly_dir = HIST_ROOT / year
              monthly_dir.mkdir(parents=True, exist_ok=True)
              monthly_path = monthly_dir / f"{year}-{month}.json"

              monthly = load_json(monthly_path, {
                  "schema": "mta_precipitaciones_mensuales_v1",
                  "year": int(year),
                  "month": int(month),
                  "records": [],
              })

              existing = monthly.get("records", [])
              new_ids = {r["record_id"] for r in records}

              filtered = [r for r in existing if r.get("record_id") not in new_ids]
              monthly["records"] = filtered + records
              monthly["updated_at_utc"] = datetime.now(timezone.utc).isoformat()
              monthly["record_count"] = len(monthly["records"])

              write_json(monthly_path, monthly)
              return monthly_path

          def write_monthly_csv(monthly_json_path: Path | None) -> Path | None:
              if monthly_json_path is None:
                  return None

              data = load_json(monthly_json_path, {"records": []})
              csv_path = monthly_json_path.with_suffix(".csv")
              records = data.get("records", [])

              fields = [
                  "record_id",
                  "observed_date",
                  "extracted_at_utc",
                  "extracted_at_gt",
                  "department",
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "variable",
                  "value",
                  "unit",
                  "aggregation_period",
                  "data_type",
                  "quality_flag",
                  "source_url",
                  "credit",
              ]

              with csv_path.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in records:
                      writer.writerow({field: row.get(field) for field in fields})

              return csv_path

          def write_inventory_csv(stations: list[dict]) -> None:
              fields = [
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "department",
                  "municipality",
                  "status",
                  "variable",
                  "precipitation_available",
                  "source_url",
                  "station_url",
                  "inventory_method",
                  "credit",
              ]

              with INVENTARIO_CSV.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in stations:
                      writer.writerow({field: row.get(field) for field in fields})

          utc_now, gt_now = now_times()
          extracted_at_utc = utc_now.isoformat()
          extracted_at_gt = gt_now.isoformat()
          observed_date = gt_now.strftime("%Y-%m-%d")

          all_records = []
          all_inventory = []
          source_status = []

          insivumeh_compat_rows = []
          insivumeh_raw_section = []

          vivamos_mejor_inventory = []
          vivamos_mejor_station_results = []
          vivamos_mejor_metadata = {}
          vivamos_mejor_raw_text = ""

          amsclae_inventory = []
          amsclae_metadata = {}
          amsclae_raw_text = ""

          for source in SOURCES:
              status = {
                  "source_id": source["source_id"],
                  "institution": source["institution"],
                  "parser": source["parser"],
                  "checked_at_utc": extracted_at_utc,
                  "checked_at_gt": extracted_at_gt,
                  "ok": False,
                  "records_added": 0,
                  "stations_found": 0,
                  "urls": [],
                  "errors": [],
              }

              if source["parser"] == "insivumeh_solola":
                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if not fetch_status["ok"]:
                          status["errors"].append(f"{url}: {fetch_status.get('error')}")
                          continue

                      try:
                          records, stations, raw_section, compat_rows = parse_insivumeh_precip(
                              source,
                              html,
                              url,
                              extracted_at_utc,
                              extracted_at_gt,
                              observed_date,
                          )

                          if records:
                              all_records.extend(records)
                              all_inventory.extend(stations)
                              insivumeh_raw_section = raw_section
                              insivumeh_compat_rows = compat_rows
                              status["ok"] = True
                              status["records_added"] = len(records)
                              status["stations_found"] = len(stations)
                              break

                      except Exception as exc:
                          status["errors"].append(f"{url}: {exc}")

              elif source["parser"] == "vivamos_mejor_precip":
                  html = ""
                  page_url = source["urls"][0]

                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if fetch_status["ok"]:
                          page_url = url
                          break

                      status["errors"].append(f"{url}: {fetch_status.get('error')}")

                  if html:
                      try:
                          stations, station_links, metadata, raw_text = parse_vivamos_mejor_inventory(
                              source,
                              html,
                              page_url,
                          )
                          vivamos_mejor_inventory = stations
                          vivamos_mejor_metadata = metadata
                          vivamos_mejor_raw_text = raw_text
                          status["ok"] = True
                          status["stations_found"] = len(stations)
                      except Exception as exc:
                          status["errors"].append(f"parse_inventory: {exc}")

                  if not vivamos_mejor_inventory:
                      vivamos_mejor_inventory = [
                          station_inventory_record(
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=item["station_name"],
                              municipality=item.get("municipality"),
                              status=item.get("status") or "por_verificar",
                              source_url=source["urls"][0],
                              station_url=None,
                              credit=source["credit"],
                              precipitation_available="por_verificar",
                              inventory_method="fallback_from_known_public_listing",
                          )
                          for item in VIVAMOS_MEJOR_FALLBACK_STATIONS
                      ]
                      vivamos_mejor_metadata = {
                          "station_count": len(vivamos_mejor_inventory),
                          "inventory_method": "fallback_from_known_public_listing",
                          "real_station_links_found": 0,
                      }

                  for station in vivamos_mejor_inventory:
                      record, station_result = fetch_station_precip(
                          station=station,
                          source=source,
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                      )

                      vivamos_mejor_station_results.append(station_result)

                      if record:
                          all_records.append(record)
                          status["records_added"] += 1
                          station["precipitation_available"] = "si_extraida"

                  all_inventory.extend(vivamos_mejor_inventory)
                  status["ok"] = True if vivamos_mejor_inventory else status["ok"]

              elif source["parser"] == "amsclae_precip":
                  pages = []

                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if fetch_status["ok"]:
                          pages.append({"url": url, "html": html})
                      else:
                          status["errors"].append(f"{url}: {fetch_status.get('error')}")

                  try:
                      stations, metadata, raw_text = parse_amsclae_precip_inventory(source, pages)
                      amsclae_inventory = stations
                      amsclae_metadata = metadata
                      amsclae_raw_text = raw_text

                      all_inventory.extend(amsclae_inventory)
                      status["ok"] = True if pages else False
                      status["stations_found"] = len(amsclae_inventory)
                      status["records_added"] = 0

                  except Exception as exc:
                      status["errors"].append(f"parse_amsclae: {exc}")

              source_status.append(status)

          monthly_path = append_monthly_records(all_records, gt_now)
          monthly_csv = write_monthly_csv(monthly_path)

          existing_inventory = load_json(INVENTARIO_JSON, {
              "schema": "mta_precipitacion_estaciones_v1",
              "stations": [],
          })

          merged_inventory = merge_inventory(
              existing_inventory.get("stations", []),
              all_inventory,
          )

          actual_payload = {
              "schema": "mta_precipitaciones_actuales_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "observed_date": observed_date,
              "department": "Sololá",
              "policy": {
                  "storage": "actual_json_mas_historico_mensual",
                  "only_precipitation": True,
                  "do_not_average_raw_stations": True,
                  "note": "Las observaciones de precipitación se conservan por estación, institución, variable, fecha y fuente. Promedios o mapas se harán como productos derivados separados.",
              },
              "latest_records": all_records,
              "monthly_history": str(monthly_path) if monthly_path else None,
              "monthly_history_csv": str(monthly_csv) if monthly_csv else None,
              "station_inventory_path": str(INVENTARIO_JSON),
              "source_status_path": str(SOURCE_STATUS_JSON),
          }

          write_json(ACTUAL_JSON, actual_payload)

          write_json(SOURCE_STATUS_JSON, {
              "schema": "mta_precipitacion_source_status_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "sources": source_status,
          })

          inventory_payload = {
              "schema": "mta_precipitacion_estaciones_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "station_count": len(merged_inventory),
              "stations": merged_inventory,
          }

          write_json(INVENTARIO_JSON, inventory_payload)
          write_inventory_csv(merged_inventory)

          write_json(INSIVUMEH_COMPAT_JSON, {
              "schema": "mta_precipitaciones_insivumeh_actual_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "INSIVUMEH",
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "stations": insivumeh_compat_rows,
          })

          INSIVUMEH_RAW_TXT.write_text("\n".join(insivumeh_raw_section), encoding="utf-8")

          with INSIVUMEH_COMPAT_CSV.open("w", encoding="utf-8", newline="") as f:
              fields = [
                  "station_id",
                  "station_name",
                  "department",
                  "institution",
                  "precipitation_mm_accumulated",
                  "rain_days",
                  "dry_days",
                  "status",
                  "data_type",
                  "credit",
              ]
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(insivumeh_compat_rows)

          write_json(VIVAMOS_MEJOR_JSON, {
              "schema": "mta_precipitaciones_vivamos_mejor_v2",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "Asociación Vivamos Mejor",
                  "url": SOURCES[1]["urls"][0],
                  "credit": SOURCES[1]["credit"],
              },
              "metadata": vivamos_mejor_metadata,
              "stations": vivamos_mejor_inventory,
              "station_extraction_results": vivamos_mejor_station_results,
              "notes": [
                  "Se extrae inventario de estaciones desde la página pública autorizada.",
                  "Se filtran enlaces genéricos y se conservan solo enlaces reales de estación cuando existen.",
                  "Se intenta extraer precipitación desde cada enlace real de estación.",
                  "Si una estación carga datos por JavaScript o servicio externo, queda registrada como precipitacion_no_detectada_en_html hasta crear parser específico.",
              ],
          })

          VIVAMOS_MEJOR_RAW_TXT.write_text(vivamos_mejor_raw_text, encoding="utf-8")

          write_json(AMSCLAE_JSON, {
              "schema": "mta_precipitaciones_amsclae_v1",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "AMSCLAE",
                  "urls": SOURCES[2]["urls"],
                  "credit": SOURCES[2]["credit"],
              },
              "metadata": amsclae_metadata,
              "stations": amsclae_inventory,
              "station_extraction_results": [],
              "notes": [
                  "Solo precipitación: AMSCLAE se integra inicialmente como inventario de estaciones con parámetro Precipitación disponible.",
                  "No se guardan variables de temperatura, viento, humedad ni radiación.",
                  "No se inventan valores numéricos si la página no entrega una tabla de precipitación directa.",
                  "El siguiente paso será identificar el endpoint del formulario climático de AMSCLAE para extraer series de precipitación.",
              ],
          })

          AMSCLAE_RAW_TXT.write_text(amsclae_raw_text, encoding="utf-8")

          print(f"OK registros numéricos de precipitación: {len(all_records)}")
          print(f"OK inventario consolidado de estaciones de precipitación: {len(merged_inventory)}")
          print(f"INSIVUMEH filas compatibilidad: {len(insivumeh_compat_rows)}")
          print(f"Vivamos Mejor estaciones: {len(vivamos_mejor_inventory)}")
          print(f"AMSCLAE estaciones/candidatas: {len(amsclae_inventory)}")
          print(f"Actual: {ACTUAL_JSON}")
          print(f"Inventario: {INVENTARIO_JSON}")
          print(f"Histórico mensual: {monthly_path}")
          print(f"Vivamos Mejor: {VIVAMOS_MEJOR_JSON}")
          print(f"AMSCLAE: {AMSCLAE_JSON}")

      - name: Guardar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/precipitaciones/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en precipitaciones."
          else
            git commit -m "Actualizar precipitaciones"
            git push
          fi
