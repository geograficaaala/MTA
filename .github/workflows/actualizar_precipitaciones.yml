name: Actualizar precipitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write

jobs:
  actualizar-precipitaciones:
    runs-on: ubuntu-latest

    env:
      # Opcional, para WeatherLink API.
      # Crear en GitHub:
      # Settings → Secrets and variables → Actions
      # Secrets:
      #   WEATHERLINK_API_KEY
      #   WEATHERLINK_API_SECRET
      #
      # Variables:
      #   WEATHERLINK_STATIONS_JSON
      #
      # Ejemplo de WEATHERLINK_STATIONS_JSON:
      # [
      #   {
      #     "station_id": 123456,
      #     "station_name": "WeatherLink Panajachel",
      #     "municipality": "Panajachel"
      #   }
      # ]
      WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
      WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
      WEATHERLINK_STATIONS_JSON: ${{ vars.WEATHERLINK_STATIONS_JSON }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests lxml certifi urllib3

      - name: Extraer precipitaciones
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import os
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin
          from zoneinfo import ZoneInfo

          import certifi
          import requests
          import urllib3
          from bs4 import BeautifulSoup
          from requests.exceptions import SSLError

          GT = ZoneInfo("America/Guatemala")

          DATA_ROOT = Path("docs/data/precipitaciones")
          HIST_ROOT = DATA_ROOT / "historico"
          RAW_ROOT = DATA_ROOT / "raw"

          DATA_ROOT.mkdir(parents=True, exist_ok=True)
          HIST_ROOT.mkdir(parents=True, exist_ok=True)
          RAW_ROOT.mkdir(parents=True, exist_ok=True)

          ACTUAL_JSON = DATA_ROOT / "actual.json"
          SOURCE_STATUS_JSON = DATA_ROOT / "source_status.json"

          INVENTARIO_JSON = DATA_ROOT / "estaciones_precipitacion.json"
          INVENTARIO_CSV = DATA_ROOT / "estaciones_precipitacion.csv"

          INSIVUMEH_COMPAT_JSON = DATA_ROOT / "insivumeh_solola.json"
          INSIVUMEH_COMPAT_CSV = DATA_ROOT / "insivumeh_solola.csv"
          INSIVUMEH_RAW_TXT = DATA_ROOT / "insivumeh_solola_raw.txt"

          VIVAMOS_MEJOR_JSON = DATA_ROOT / "vivamos_mejor_precipitacion.json"
          VIVAMOS_MEJOR_RAW_TXT = DATA_ROOT / "vivamos_mejor_raw.txt"

          PWS_JSON = DATA_ROOT / "pws_precipitacion.json"

          SOURCES = [
              {
                  "source_id": "insivumeh_precipitaciones_departamentos",
                  "institution": "INSIVUMEH",
                  "parser": "insivumeh_solola",
                  "urls": [
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Departamentos.html",
                      "https://insivumeh.gob.gt/img/MAPAS_24H/Sin_Lluvia/Resumen_Cronologico.html",
                  ],
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "vivamos_mejor_estaciones",
                  "institution": "Asociación Vivamos Mejor",
                  "parser": "vivamos_mejor_precip",
                  "urls": [
                      "https://www.vivamosmejor.org.gt/sitio/estaciones-meteorologicas-solola/",
                  ],
                  "credit": "Datos: Asociación Vivamos Mejor. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              {
                  "source_id": "pws_complementarias",
                  "institution": "Estaciones PWS complementarias",
                  "parser": "pws_precip",
                  "urls": [],
                  "credit": "Datos: estación meteorológica complementaria pública. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
          ]

          VIVAMOS_MEJOR_FALLBACK_STATIONS = [
              {"station_name": "Estación Oficina Central", "municipality": "Panajachel", "status": "por_verificar"},
              {"station_name": "Estación Casa Santa Rita", "municipality": "Santa Lucía Utatlán", "status": "por_verificar"},
              {"station_name": "Estación CoAtitlán R.L.", "municipality": "Santiago Atitlán", "status": "por_verificar"},
              {"station_name": "Estación Lomas de Atitlán", "municipality": "San Andrés Semetabaj", "status": "por_verificar"},
              {"station_name": "Estación CEDRACC", "municipality": "Santa Cruz La Laguna", "status": "por_verificar"},
              {"station_name": "Estación Santa Clara TV Cable", "municipality": "Santa Clara La Laguna", "status": "por_verificar"},
              {"station_name": "Caserío Chuacruz", "municipality": "Aldea Pujujil I, Sololá", "status": "mantenimiento"},
              {"station_name": "Estación Escuela de Formación Agrícola", "municipality": "Sololá", "status": "por_verificar"},
          ]

          # Lista blanca semilla de PWS observadas en enlaces públicos de Vivamos Mejor.
          # Si Vivamos Mejor expone más enlaces reales, el extractor también los detecta automáticamente.
          PWS_FALLBACK = [
              {
                  "provider": "wunderground",
                  "station_code": "IPANAJ5",
                  "station_name": "PWS Panajachel",
                  "municipality": "Panajachel",
                  "station_url": "https://www.wunderground.com/dashboard/pws/IPANAJ5",
              },
              {
                  "provider": "wunderground",
                  "station_code": "ISANTA535",
                  "station_name": "PWS Santa Lucía Utatlán",
                  "municipality": "Santa Lucía Utatlán",
                  "station_url": "https://www.wunderground.com/dashboard/pws/ISANTA535",
              },
              {
                  "provider": "wunderground",
                  "station_code": "ISANTACL3",
                  "station_name": "PWS Santa Clara La Laguna",
                  "municipality": "Santa Clara La Laguna",
                  "station_url": "https://www.wunderground.com/dashboard/pws/ISANTACL3",
              },
              {
                  "provider": "wunderground",
                  "station_code": "ISANTI135",
                  "station_name": "PWS Santiago Atitlán",
                  "municipality": "Santiago Atitlán",
                  "station_url": "https://www.wunderground.com/dashboard/pws/ISANTI135",
              },
              {
                  "provider": "wunderground",
                  "station_code": "ISANAN84",
                  "station_name": "PWS San Andrés Semetabaj",
                  "municipality": "San Andrés Semetabaj",
                  "station_url": "https://www.wunderground.com/dashboard/pws/ISANAN84",
              },
              {
                  "provider": "wunderground",
                  "station_code": "ISOLOL4",
                  "station_name": "PWS Sololá",
                  "municipality": "Sololá",
                  "station_url": "https://www.wunderground.com/dashboard/pws/ISOLOL4",
              },
          ]

          DEPARTAMENTOS = [
              "alta verapaz",
              "baja verapaz",
              "chimaltenango",
              "chiquimula",
              "el progreso",
              "escuintla",
              "guatemala",
              "huehuetenango",
              "izabal",
              "jalapa",
              "jutiapa",
              "peten",
              "quetzaltenango",
              "quiche",
              "retalhuleu",
              "sacatepequez",
              "san marcos",
              "santa rosa",
              "solola",
              "suchitepequez",
              "totonicapan",
              "zacapa",
              "region norte",
          ]

          def now_times() -> tuple[datetime, datetime]:
              utc = datetime.now(timezone.utc)
              gt = utc.astimezone(GT)
              return utc, gt

          def normalizar(texto: str) -> str:
              texto = str(texto or "")
              texto = texto.replace("\ufeff", " ")
              texto = texto.replace("\xa0", " ")
              texto = texto.strip().lower()
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              texto = texto.replace("#", " ")
              texto = texto.replace(":", " ")
              texto = re.sub(r"\s+", " ", texto)
              return texto.strip()

          def slug(texto: str) -> str:
              limpio = normalizar(texto)
              limpio = re.sub(r"[^a-z0-9]+", "_", limpio)
              return limpio.strip("_")

          def make_station_id(institution: str, station_name: str) -> str:
              return f"{slug(institution)}_{slug(station_name)}"

          def es_solola(linea: str) -> bool:
              limpia = normalizar(linea)
              return limpia == "solola" or limpia.startswith("solola ") or " solola " in f" {limpia} "

          def es_departamento(linea: str) -> bool:
              return normalizar(linea) in DEPARTAMENTOS

          def numero_mm(linea: str) -> float | None:
              match = re.search(
                  r"([0-9]+(?:[.,][0-9]+)?)\s*(?:mm|milimetros|milímetros)",
                  linea,
                  flags=re.I,
              )
              if not match:
                  return None
              return float(match.group(1).replace(",", "."))

          def pulgadas_a_mm(value: float) -> float:
              return round(value * 25.4, 3)

          def buscar_dias_en_bloque(lineas: list[str]) -> tuple[int | None, int | None]:
              texto = " | ".join(normalizar(x) for x in lineas)

              con_lluvia = None
              sin_lluvia = None

              match_con = re.search(r"([0-9]+)\s*dias?\s*con\s*lluvia", texto)
              match_sin = re.search(r"([0-9]+)\s*dias?\s*sin\s*lluvia", texto)

              if match_con:
                  con_lluvia = int(match_con.group(1))
              if match_sin:
                  sin_lluvia = int(match_sin.group(1))

              return con_lluvia, sin_lluvia

          def fetch_url(url: str) -> tuple[str, dict]:
              headers = {
                  "User-Agent": "MTA-Solola-Precipitaciones/0.8 (+https://github.com/geograficaaala/MTA)",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              }

              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "ssl_mode": None,
                  "content_length": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers,
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  response.encoding = response.apparent_encoding or "utf-8"
                  status.update({
                      "ok": True,
                      "status_code": response.status_code,
                      "ssl_mode": "ssl_verificado",
                      "content_length": len(response.text),
                  })
                  return response.text, status

              except SSLError:
                  try:
                      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
                      response = requests.get(
                          url,
                          timeout=45,
                          headers=headers,
                          verify=False,
                      )
                      response.raise_for_status()
                      response.encoding = response.apparent_encoding or "utf-8"
                      status.update({
                          "ok": True,
                          "status_code": response.status_code,
                          "ssl_mode": "ssl_no_verificado_por_certificado_fuente",
                          "content_length": len(response.text),
                      })
                      return response.text, status
                  except Exception as exc:
                      status["error"] = str(exc)
                      return "", status

              except Exception as exc:
                  status["error"] = str(exc)
                  return "", status

          def fetch_json(url: str, headers: dict | None = None, params: dict | None = None) -> tuple[dict | None, dict]:
              status = {
                  "url": url,
                  "ok": False,
                  "status_code": None,
                  "error": None,
              }

              try:
                  response = requests.get(
                      url,
                      timeout=45,
                      headers=headers or {},
                      params=params or {},
                      verify=certifi.where(),
                  )
                  response.raise_for_status()
                  status.update({
                      "ok": True,
                      "status_code": response.status_code,
                  })
                  return response.json(), status
              except Exception as exc:
                  status["error"] = str(exc)
                  return None, status

          def html_to_soup(html: str) -> BeautifulSoup:
              soup = BeautifulSoup(html, "lxml")
              for tag in soup(["script", "style", "noscript"]):
                  tag.decompose()
              return soup

          def soup_to_lines(soup: BeautifulSoup) -> list[str]:
              return [line.strip() for line in soup.get_text("\n").splitlines() if line.strip()]

          def load_json(path: Path, default: dict) -> dict:
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return default

          def write_json(path: Path, data: dict) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

          def precipitation_record(
              *,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              source_id: str,
              institution: str,
              station_name: str,
              variable: str,
              value: float | int,
              unit: str,
              source_url: str,
              credit: str,
              aggregation_period: str,
              quality_flag: str = "raw_published",
          ) -> dict:
              station_id = make_station_id(institution, station_name)
              variable_slug = slug(variable)

              return {
                  "record_id": f"{observed_date}_{source_id}_{station_id}_{variable_slug}",
                  "observed_date": observed_date,
                  "extracted_at_utc": extracted_at_utc,
                  "extracted_at_gt": extracted_at_gt,
                  "department": "Sololá",
                  "station_id": station_id,
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "variable": variable,
                  "value": value,
                  "unit": unit,
                  "aggregation_period": aggregation_period,
                  "data_type": "observado_publicado",
                  "quality_flag": quality_flag,
                  "source_url": source_url,
                  "credit": credit,
              }

          def station_inventory_record(
              *,
              source_id: str,
              institution: str,
              station_name: str,
              municipality: str | None,
              status: str,
              source_url: str,
              credit: str,
              station_url: str | None = None,
              provider: str | None = None,
              station_code: str | None = None,
              precipitation_available: str = "por_verificar",
              inventory_method: str = "extracted",
          ) -> dict:
              return {
                  "station_id": make_station_id(institution, station_name),
                  "station_name": station_name,
                  "institution": institution,
                  "source_id": source_id,
                  "department": "Sololá",
                  "municipality": municipality,
                  "status": status,
                  "variable": "precipitation",
                  "provider": provider,
                  "station_code": station_code,
                  "precipitation_available": precipitation_available,
                  "source_url": source_url,
                  "station_url": station_url,
                  "inventory_method": inventory_method,
                  "credit": credit,
              }

          def obtener_seccion_solola(lines: list[str]) -> list[str]:
              inicio = None

              for i, line in enumerate(lines):
                  if es_solola(line):
                      inicio = i + 1
                      break

              if inicio is None:
                  raise RuntimeError("No se encontró la sección de Sololá.")

              fin = len(lines)

              for j in range(inicio, len(lines)):
                  if es_departamento(lines[j]) and not es_solola(lines[j]):
                      fin = j
                      break

              return lines[inicio:fin]

          def parse_insivumeh_precip(
              source: dict,
              html: str,
              source_url: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
              observed_date: str,
          ) -> tuple[list[dict], list[dict], list[str], list[dict]]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              seccion = obtener_seccion_solola(lines)

              records = []
              stations = []
              compat_rows = []

              i = 0
              while i < len(seccion):
                  linea = seccion[i].strip()
                  siguiente = seccion[i + 1].strip() if i + 1 < len(seccion) else ""
                  valor_precip = numero_mm(siguiente)

                  if valor_precip is not None:
                      station_name = linea
                      bloque = seccion[i:i + 12]
                      rain_days, dry_days = buscar_dias_en_bloque(bloque)

                      records.append(precipitation_record(
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          variable="precipitation_accumulated",
                          value=valor_precip,
                          unit="mm",
                          aggregation_period="periodo_publicado_por_fuente",
                          source_url=source_url,
                          credit=source["credit"],
                      ))

                      if rain_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="rain_days",
                              value=rain_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      if dry_days is not None:
                          records.append(precipitation_record(
                              observed_date=observed_date,
                              extracted_at_utc=extracted_at_utc,
                              extracted_at_gt=extracted_at_gt,
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=station_name,
                              variable="dry_days",
                              value=dry_days,
                              unit="days",
                              aggregation_period="periodo_publicado_por_fuente",
                              source_url=source_url,
                              credit=source["credit"],
                          ))

                      stations.append(station_inventory_record(
                          source_id=source["source_id"],
                          institution=source["institution"],
                          station_name=station_name,
                          municipality=None,
                          status="activa_por_verificar",
                          source_url=source_url,
                          station_url=None,
                          provider="insivumeh",
                          station_code=None,
                          credit=source["credit"],
                          precipitation_available="si",
                          inventory_method="from_precipitation_page",
                      ))

                      compat_rows.append({
                          "station_id": make_station_id(source["institution"], station_name),
                          "station_name": station_name,
                          "department": "Sololá",
                          "institution": source["institution"],
                          "precipitation_mm_accumulated": valor_precip,
                          "rain_days": rain_days,
                          "dry_days": dry_days,
                          "status": "extraido",
                          "data_type": "observado_publicado",
                          "credit": source["credit"],
                      })

                      i += 2
                      continue

                  i += 1

              return records, stations, seccion, compat_rows

          def is_real_station_link(url: str) -> bool:
              clean = normalizar(url)
              return (
                  "wunderground.com/dashboard/pws/" in clean
                  or "ambientweather.net/dashboard" in clean
                  or "weatherlink.com" in clean
                  or "pwsweather" in clean
              )

          def detect_provider_and_code(url: str) -> tuple[str | None, str | None]:
              clean = url.strip()

              match_wu = re.search(r"wunderground\.com/dashboard/pws/([A-Za-z0-9_-]+)", clean, flags=re.I)
              if match_wu:
                  return "wunderground", match_wu.group(1).upper()

              if "ambientweather.net" in clean.lower():
                  return "ambientweather", None

              if "weatherlink.com" in clean.lower():
                  return "weatherlink", None

              if "pwsweather" in clean.lower():
                  return "pwsweather", None

              return None, None

          def parse_vivamos_mejor_inventory(source: dict, html: str, source_url: str) -> tuple[list[dict], list[dict], dict, str]:
              soup = html_to_soup(html)
              lines = soup_to_lines(soup)
              raw_text = "\n".join(lines)

              all_links = []
              station_links = []

              for a in soup.find_all("a"):
                  label = a.get_text(" ", strip=True)
                  href = a.get("href")
                  if not href:
                      continue

                  full_url = urljoin(source_url, href)
                  provider, station_code = detect_provider_and_code(full_url)

                  item = {
                      "label": label,
                      "url": full_url,
                      "provider": provider,
                      "station_code": station_code,
                  }

                  all_links.append(item)

                  if is_real_station_link(full_url):
                      station_links.append(item)

              parsed = []
              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  clean = normalizar(line)

                  is_station = (
                      clean.startswith("estacion ")
                      or clean.startswith("estación ")
                      or clean.startswith("caserio ")
                      or clean.startswith("caserío ")
                  )

                  if is_station:
                      station_name = line
                      municipality = None
                      status = "por_verificar"

                      for j in range(i + 1, min(i + 7, len(lines))):
                          candidate = lines[j].strip()
                          candidate_clean = normalizar(candidate)

                          if not candidate:
                              continue

                          if "mantenimiento" in candidate_clean:
                              status = "mantenimiento"
                              break

                          if "accede aqui" in candidate_clean or "accede aquí" in candidate_clean:
                              break

                          if (
                              not candidate_clean.startswith("estacion")
                              and not candidate_clean.startswith("estación")
                              and "meteorologica" not in candidate_clean
                              and "meteorológica" not in candidate_clean
                          ):
                              municipality = candidate
                              break

                      parsed.append({
                          "station_name": station_name,
                          "municipality": municipality,
                          "status": status,
                      })

                  i += 1

              inventory_method = "extracted_from_source_page"
              if not parsed:
                  parsed = VIVAMOS_MEJOR_FALLBACK_STATIONS
                  inventory_method = "fallback_from_known_public_listing"

              stations = []
              for idx, item in enumerate(parsed):
                  link = station_links[idx] if idx < len(station_links) else None
                  station_url = link["url"] if link else None
                  provider = link["provider"] if link else None
                  station_code = link["station_code"] if link else None

                  stations.append(station_inventory_record(
                      source_id=source["source_id"],
                      institution=source["institution"],
                      station_name=item["station_name"],
                      municipality=item.get("municipality"),
                      status=item.get("status") or "por_verificar",
                      source_url=source_url,
                      station_url=station_url,
                      provider=provider,
                      station_code=station_code,
                      credit=source["credit"],
                      precipitation_available="por_verificar",
                      inventory_method=inventory_method,
                  ))

              metadata = {
                  "station_count": len(stations),
                  "all_links_found": len(all_links),
                  "real_station_links_found": len(station_links),
                  "real_station_links": station_links,
                  "ignored_links": [x for x in all_links if not is_real_station_link(x["url"])],
                  "inventory_method": inventory_method,
                  "note": "Se ignoran enlaces genéricos. Solo se usan enlaces reales de estación como Wunderground, Ambient Weather, WeatherLink o PWSWeather.",
              }

              return stations, station_links, metadata, raw_text

          def extract_precip_from_station_page(text: str) -> tuple[float | None, str | None]:
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              keywords = [
                  "precipitacion",
                  "precipitación",
                  "lluvia",
                  "rain",
                  "rainfall",
                  "rain rate",
                  "rain today",
                  "daily rain",
                  "precip",
              ]

              for i, line in enumerate(lines):
                  clean = normalizar(line)
                  if not any(normalizar(k) in clean for k in keywords):
                      continue

                  block = " | ".join(lines[max(0, i - 2): min(len(lines), i + 5)])
                  value = numero_mm(block)

                  if value is not None:
                      return value, block

              keyword_pattern = r"(precipitaci[oó]n|lluvia|rain|rainfall|rain today|daily rain|precip)"
              match = re.search(
                  keyword_pattern + r".{0,200}?([0-9]+(?:[.,][0-9]+)?)\s*mm",
                  text,
                  flags=re.I | re.S,
              )

              if match:
                  return float(match.group(2).replace(",", ".")), match.group(0)

              return None, None

          def fetch_public_station_precip(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
          ) -> tuple[dict | None, dict]:
              station_url = station.get("station_url")

              result = {
                  "station_id": station["station_id"],
                  "station_name": station["station_name"],
                  "provider": station.get("provider"),
                  "station_code": station.get("station_code"),
                  "station_url": station_url,
                  "ok": False,
                  "precipitation_found": False,
                  "error": None,
                  "matched_text": None,
              }

              if not station_url:
                  result["error"] = "sin_url_de_estacion"
                  return None, result

              html, status = fetch_url(station_url)
              result["fetch_status"] = status

              if not status["ok"]:
                  result["error"] = status.get("error") or "no_response"
                  return None, result

              soup = html_to_soup(html)
              text = soup.get_text("\n")
              value, matched = extract_precip_from_station_page(text + "\n" + html)

              if value is None:
                  result["ok"] = True
                  result["error"] = "precipitacion_no_detectada_en_html"
                  return None, result

              result["ok"] = True
              result["precipitation_found"] = True
              result["matched_text"] = matched

              record = precipitation_record(
                  observed_date=observed_date,
                  extracted_at_utc=extracted_at_utc,
                  extracted_at_gt=extracted_at_gt,
                  source_id=station.get("source_id") or source["source_id"],
                  institution=station.get("institution") or source["institution"],
                  station_name=station["station_name"],
                  variable="precipitation_accumulated",
                  value=value,
                  unit="mm",
                  aggregation_period="periodo_publicado_por_fuente",
                  source_url=station_url,
                  credit=station.get("credit") or source["credit"],
                  quality_flag="raw_published_detected_from_station_page",
              )

              return record, result

          def load_weatherlink_station_list() -> list[dict]:
              raw = os.getenv("WEATHERLINK_STATIONS_JSON", "").strip()
              if not raw:
                  return []

              try:
                  data = json.loads(raw)
                  if isinstance(data, list):
                      return data
                  return []
              except Exception:
                  return []

          def flatten_json(obj, prefix=""):
              items = []
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      new_prefix = f"{prefix}.{key}" if prefix else str(key)
                      items.extend(flatten_json(value, new_prefix))
              elif isinstance(obj, list):
                  for idx, value in enumerate(obj):
                      new_prefix = f"{prefix}.{idx}" if prefix else str(idx)
                      items.extend(flatten_json(value, new_prefix))
              else:
                  items.append((prefix, obj))
              return items

          def find_weatherlink_precip_value(payload: dict) -> tuple[float | None, str | None]:
              candidates_mm = [
                  "rainfall_daily_mm",
                  "rain_day_mm",
                  "rainfall_day_mm",
                  "daily_rain_mm",
                  "rain_storm_mm",
                  "rainfall_monthly_mm",
              ]

              candidates_in = [
                  "rainfall_daily_in",
                  "rain_day_in",
                  "rainfall_day_in",
                  "daily_rain_in",
                  "rain_storm_in",
              ]

              flat = flatten_json(payload)

              for key, value in flat:
                  clean_key = normalizar(key).replace(" ", "_")
                  try:
                      numeric = float(value)
                  except Exception:
                      continue

                  if any(candidate in clean_key for candidate in candidates_mm):
                      return numeric, key

              for key, value in flat:
                  clean_key = normalizar(key).replace(" ", "_")
                  try:
                      numeric = float(value)
                  except Exception:
                      continue

                  if any(candidate in clean_key for candidate in candidates_in):
                      return pulgadas_a_mm(numeric), key

              for key, value in flat:
                  clean_key = normalizar(key)
                  try:
                      numeric = float(value)
                  except Exception:
                      continue

                  if "rain" in clean_key and "rate" not in clean_key and ("daily" in clean_key or "day" in clean_key or "storm" in clean_key):
                      if "in" in clean_key and "mm" not in clean_key:
                          return pulgadas_a_mm(numeric), key
                      return numeric, key

              return None, None

          def fetch_weatherlink_api_precip(
              *,
              station: dict,
              source: dict,
              observed_date: str,
              extracted_at_utc: str,
              extracted_at_gt: str,
          ) -> tuple[dict | None, dict]:
              api_key = os.getenv("WEATHERLINK_API_KEY", "").strip()
              api_secret = os.getenv("WEATHERLINK_API_SECRET", "").strip()

              result = {
                  "provider": "weatherlink_api",
                  "station_id": station.get("station_id"),
                  "station_name": station.get("station_name"),
                  "municipality": station.get("municipality"),
                  "ok": False,
                  "precipitation_found": False,
                  "error": None,
                  "matched_field": None,
              }

              if not api_key or not api_secret:
                  result["error"] = "weatherlink_api_sin_credenciales"
                  return None, result

              wl_station_id = station.get("station_id")
              if wl_station_id is None:
                  result["error"] = "weatherlink_station_id_faltante"
                  return None, result

              url = f"https://api.weatherlink.com/v2/current/{wl_station_id}"

              payload, status = fetch_json(
                  url,
                  headers={"X-Api-Secret": api_secret},
                  params={"api-key": api_key},
              )
              result["fetch_status"] = status

              if not status["ok"] or not payload:
                  result["error"] = status.get("error") or "weatherlink_no_response"
                  return None, result

              value, matched_field = find_weatherlink_precip_value(payload)

              if value is None:
                  result["ok"] = True
                  result["error"] = "precipitacion_no_detectada_en_weatherlink_payload"
                  return None, result

              result["ok"] = True
              result["precipitation_found"] = True
              result["matched_field"] = matched_field

              station_name = station.get("station_name") or f"WeatherLink {wl_station_id}"

              record = precipitation_record(
                  observed_date=observed_date,
                  extracted_at_utc=extracted_at_utc,
                  extracted_at_gt=extracted_at_gt,
                  source_id=source["source_id"],
                  institution="WeatherLink",
                  station_name=station_name,
                  variable="precipitation_accumulated",
                  value=value,
                  unit="mm",
                  aggregation_period=f"weatherlink_current_field:{matched_field}",
                  source_url=url,
                  credit="Datos: WeatherLink. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
                  quality_flag="weatherlink_api_detected_field",
              )

              return record, result

          def merge_inventory(existing: list[dict], incoming: list[dict]) -> list[dict]:
              by_id = {item["station_id"]: item for item in existing if item.get("station_id")}
              for item in incoming:
                  by_id[item["station_id"]] = item
              return sorted(by_id.values(), key=lambda x: (x.get("institution", ""), x.get("station_name", "")))

          def append_monthly_records(records: list[dict], gt_now: datetime) -> Path | None:
              if not records:
                  return None

              year = gt_now.strftime("%Y")
              month = gt_now.strftime("%m")

              monthly_dir = HIST_ROOT / year
              monthly_dir.mkdir(parents=True, exist_ok=True)
              monthly_path = monthly_dir / f"{year}-{month}.json"

              monthly = load_json(monthly_path, {
                  "schema": "mta_precipitaciones_mensuales_v1",
                  "year": int(year),
                  "month": int(month),
                  "records": [],
              })

              existing = monthly.get("records", [])
              new_ids = {r["record_id"] for r in records}

              filtered = [r for r in existing if r.get("record_id") not in new_ids]
              monthly["records"] = filtered + records
              monthly["updated_at_utc"] = datetime.now(timezone.utc).isoformat()
              monthly["record_count"] = len(monthly["records"])

              write_json(monthly_path, monthly)
              return monthly_path

          def write_monthly_csv(monthly_json_path: Path | None) -> Path | None:
              if monthly_json_path is None:
                  return None

              data = load_json(monthly_json_path, {"records": []})
              csv_path = monthly_json_path.with_suffix(".csv")
              records = data.get("records", [])

              fields = [
                  "record_id",
                  "observed_date",
                  "extracted_at_utc",
                  "extracted_at_gt",
                  "department",
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "variable",
                  "value",
                  "unit",
                  "aggregation_period",
                  "data_type",
                  "quality_flag",
                  "source_url",
                  "credit",
              ]

              with csv_path.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in records:
                      writer.writerow({field: row.get(field) for field in fields})

              return csv_path

          def write_inventory_csv(stations: list[dict]) -> None:
              fields = [
                  "station_id",
                  "station_name",
                  "institution",
                  "source_id",
                  "department",
                  "municipality",
                  "status",
                  "variable",
                  "provider",
                  "station_code",
                  "precipitation_available",
                  "source_url",
                  "station_url",
                  "inventory_method",
                  "credit",
              ]

              with INVENTARIO_CSV.open("w", encoding="utf-8", newline="") as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  for row in stations:
                      writer.writerow({field: row.get(field) for field in fields})

          utc_now, gt_now = now_times()
          extracted_at_utc = utc_now.isoformat()
          extracted_at_gt = gt_now.isoformat()
          observed_date = gt_now.strftime("%Y-%m-%d")

          all_records = []
          all_inventory = []
          source_status = []

          insivumeh_compat_rows = []
          insivumeh_raw_section = []

          vivamos_mejor_inventory = []
          vivamos_mejor_station_results = []
          vivamos_mejor_metadata = {}
          vivamos_mejor_raw_text = ""

          pws_inventory = []
          pws_results = []

          for source in SOURCES:
              status = {
                  "source_id": source["source_id"],
                  "institution": source["institution"],
                  "parser": source["parser"],
                  "checked_at_utc": extracted_at_utc,
                  "checked_at_gt": extracted_at_gt,
                  "ok": False,
                  "records_added": 0,
                  "stations_found": 0,
                  "urls": [],
                  "errors": [],
              }

              if source["parser"] == "insivumeh_solola":
                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if not fetch_status["ok"]:
                          status["errors"].append(f"{url}: {fetch_status.get('error')}")
                          continue

                      try:
                          records, stations, raw_section, compat_rows = parse_insivumeh_precip(
                              source,
                              html,
                              url,
                              extracted_at_utc,
                              extracted_at_gt,
                              observed_date,
                          )

                          if records:
                              all_records.extend(records)
                              all_inventory.extend(stations)
                              insivumeh_raw_section = raw_section
                              insivumeh_compat_rows = compat_rows
                              status["ok"] = True
                              status["records_added"] = len(records)
                              status["stations_found"] = len(stations)
                              break

                      except Exception as exc:
                          status["errors"].append(f"{url}: {exc}")

              elif source["parser"] == "vivamos_mejor_precip":
                  html = ""
                  page_url = source["urls"][0]

                  for url in source["urls"]:
                      html, fetch_status = fetch_url(url)
                      status["urls"].append(fetch_status)

                      if fetch_status["ok"]:
                          page_url = url
                          break

                      status["errors"].append(f"{url}: {fetch_status.get('error')}")

                  if html:
                      try:
                          stations, station_links, metadata, raw_text = parse_vivamos_mejor_inventory(
                              source,
                              html,
                              page_url,
                          )
                          vivamos_mejor_inventory = stations
                          vivamos_mejor_metadata = metadata
                          vivamos_mejor_raw_text = raw_text
                          status["ok"] = True
                          status["stations_found"] = len(stations)
                      except Exception as exc:
                          status["errors"].append(f"parse_inventory: {exc}")

                  if not vivamos_mejor_inventory:
                      vivamos_mejor_inventory = [
                          station_inventory_record(
                              source_id=source["source_id"],
                              institution=source["institution"],
                              station_name=item["station_name"],
                              municipality=item.get("municipality"),
                              status=item.get("status") or "por_verificar",
                              source_url=source["urls"][0],
                              station_url=None,
                              provider=None,
                              station_code=None,
                              credit=source["credit"],
                              precipitation_available="por_verificar",
                              inventory_method="fallback_from_known_public_listing",
                          )
                          for item in VIVAMOS_MEJOR_FALLBACK_STATIONS
                      ]
                      vivamos_mejor_metadata = {
                          "station_count": len(vivamos_mejor_inventory),
                          "inventory_method": "fallback_from_known_public_listing",
                          "real_station_links_found": 0,
                      }

                  for station in vivamos_mejor_inventory:
                      record, station_result = fetch_public_station_precip(
                          station=station,
                          source=source,
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                      )

                      vivamos_mejor_station_results.append(station_result)

                      if record:
                          all_records.append(record)
                          status["records_added"] += 1
                          station["precipitation_available"] = "si_extraida"

                  all_inventory.extend(vivamos_mejor_inventory)
                  status["ok"] = True if vivamos_mejor_inventory else status["ok"]

              elif source["parser"] == "pws_precip":
                  # 1. PWS detectadas desde Vivamos Mejor.
                  detected_pws = []
                  for station in vivamos_mejor_inventory:
                      if station.get("station_url") and station.get("provider"):
                          detected_pws.append({
                              "provider": station.get("provider"),
                              "station_code": station.get("station_code"),
                              "station_name": station.get("station_name"),
                              "municipality": station.get("municipality"),
                              "station_url": station.get("station_url"),
                              "credit": station.get("credit"),
                          })

                  # 2. Lista blanca semilla.
                  detected_codes = {item.get("station_code") for item in detected_pws if item.get("station_code")}
                  for item in PWS_FALLBACK:
                      if item.get("station_code") not in detected_codes:
                          detected_pws.append(item)

                  # 3. WeatherLink API opcional.
                  weatherlink_api_stations = load_weatherlink_station_list()

                  for item in detected_pws:
                      station = station_inventory_record(
                          source_id=source["source_id"],
                          institution="Estación PWS complementaria",
                          station_name=item.get("station_name") or item.get("station_code") or "PWS sin nombre",
                          municipality=item.get("municipality"),
                          status="complementaria_por_verificar",
                          source_url=item.get("station_url"),
                          station_url=item.get("station_url"),
                          provider=item.get("provider"),
                          station_code=item.get("station_code"),
                          credit=item.get("credit") or source["credit"],
                          precipitation_available="por_verificar",
                          inventory_method="pws_whitelist_or_detected_from_vivamos_mejor",
                      )

                      pws_inventory.append(station)

                      record, station_result = fetch_public_station_precip(
                          station=station,
                          source=source,
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                      )

                      pws_results.append(station_result)

                      if record:
                          all_records.append(record)
                          status["records_added"] += 1
                          station["precipitation_available"] = "si_extraida_html"

                  for wl_station in weatherlink_api_stations:
                      wl_station_name = wl_station.get("station_name") or f"WeatherLink {wl_station.get('station_id')}"
                      station = station_inventory_record(
                          source_id=source["source_id"],
                          institution="WeatherLink",
                          station_name=wl_station_name,
                          municipality=wl_station.get("municipality"),
                          status="api_por_verificar",
                          source_url=f"https://api.weatherlink.com/v2/current/{wl_station.get('station_id')}",
                          station_url=None,
                          provider="weatherlink_api",
                          station_code=str(wl_station.get("station_id")),
                          credit="Datos: WeatherLink. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
                          precipitation_available="por_verificar",
                          inventory_method="weatherlink_api_variable",
                      )

                      pws_inventory.append(station)

                      record, station_result = fetch_weatherlink_api_precip(
                          station=wl_station,
                          source=source,
                          observed_date=observed_date,
                          extracted_at_utc=extracted_at_utc,
                          extracted_at_gt=extracted_at_gt,
                      )

                      pws_results.append(station_result)

                      if record:
                          all_records.append(record)
                          status["records_added"] += 1
                          station["precipitation_available"] = "si_extraida_api"

                  all_inventory.extend(pws_inventory)
                  status["ok"] = True
                  status["stations_found"] = len(pws_inventory)
                  status["urls"] = [
                      {
                          "url": item.get("station_url") or item.get("source_url"),
                          "ok": True,
                          "provider": item.get("provider"),
                          "station_code": item.get("station_code"),
                      }
                      for item in pws_inventory
                  ]

              source_status.append(status)

          monthly_path = append_monthly_records(all_records, gt_now)
          monthly_csv = write_monthly_csv(monthly_path)

          existing_inventory = load_json(INVENTARIO_JSON, {
              "schema": "mta_precipitacion_estaciones_v1",
              "stations": [],
          })

          merged_inventory = merge_inventory(
              existing_inventory.get("stations", []),
              all_inventory,
          )

          actual_payload = {
              "schema": "mta_precipitaciones_actuales_v3",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "observed_date": observed_date,
              "department": "Sololá",
              "policy": {
                  "storage": "actual_json_mas_historico_mensual",
                  "only_precipitation": True,
                  "do_not_average_raw_stations": True,
                  "included_sources": [
                      "INSIVUMEH",
                      "Asociación Vivamos Mejor",
                      "Estaciones PWS complementarias",
                      "WeatherLink API opcional si hay credenciales",
                  ],
                  "excluded_sources_for_now": [
                      "AMSCLAE",
                  ],
                  "note": "Las observaciones de precipitación se conservan por estación, institución, proveedor, variable, fecha y fuente. Promedios o mapas se harán como productos derivados separados.",
              },
              "latest_records": all_records,
              "monthly_history": str(monthly_path) if monthly_path else None,
              "monthly_history_csv": str(monthly_csv) if monthly_csv else None,
              "station_inventory_path": str(INVENTARIO_JSON),
              "source_status_path": str(SOURCE_STATUS_JSON),
          }

          write_json(ACTUAL_JSON, actual_payload)

          write_json(SOURCE_STATUS_JSON, {
              "schema": "mta_precipitacion_source_status_v3",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "sources": source_status,
          })

          inventory_payload = {
              "schema": "mta_precipitacion_estaciones_v3",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "station_count": len(merged_inventory),
              "stations": merged_inventory,
          }

          write_json(INVENTARIO_JSON, inventory_payload)
          write_inventory_csv(merged_inventory)

          write_json(INSIVUMEH_COMPAT_JSON, {
              "schema": "mta_precipitaciones_insivumeh_actual_v3",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "INSIVUMEH",
                  "credit": "Datos: INSIVUMEH. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "stations": insivumeh_compat_rows,
          })

          INSIVUMEH_RAW_TXT.write_text("\n".join(insivumeh_raw_section), encoding="utf-8")

          with INSIVUMEH_COMPAT_CSV.open("w", encoding="utf-8", newline="") as f:
              fields = [
                  "station_id",
                  "station_name",
                  "department",
                  "institution",
                  "precipitation_mm_accumulated",
                  "rain_days",
                  "dry_days",
                  "status",
                  "data_type",
                  "credit",
              ]
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(insivumeh_compat_rows)

          write_json(VIVAMOS_MEJOR_JSON, {
              "schema": "mta_precipitaciones_vivamos_mejor_v3",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "Asociación Vivamos Mejor",
                  "url": SOURCES[1]["urls"][0],
                  "credit": SOURCES[1]["credit"],
              },
              "metadata": vivamos_mejor_metadata,
              "stations": vivamos_mejor_inventory,
              "station_extraction_results": vivamos_mejor_station_results,
              "notes": [
                  "Se extrae inventario de estaciones desde la página pública autorizada.",
                  "Se filtran enlaces genéricos y se conservan solo enlaces reales de estación.",
                  "Se intenta extraer precipitación desde cada enlace real de estación.",
                  "Si una estación carga datos por JavaScript o servicio externo, queda registrada como precipitacion_no_detectada_en_html hasta crear parser específico o usar API.",
              ],
          })

          VIVAMOS_MEJOR_RAW_TXT.write_text(vivamos_mejor_raw_text, encoding="utf-8")

          write_json(PWS_JSON, {
              "schema": "mta_precipitaciones_pws_v1",
              "generated_at_utc": extracted_at_utc,
              "generated_at_gt": extracted_at_gt,
              "department": "Sololá",
              "source": {
                  "institution": "Estaciones PWS complementarias",
                  "credit": "Datos: estación meteorológica complementaria pública. Visualización y procesamiento: Mesa Técnica Agroclimática de Sololá.",
              },
              "stations": pws_inventory,
              "station_extraction_results": pws_results,
              "weatherlink_api_enabled": bool(os.getenv("WEATHERLINK_API_KEY", "").strip() and os.getenv("WEATHERLINK_API_SECRET", "").strip()),
              "notes": [
                  "AMSCLAE queda fuera del flujo automático de precipitación por ahora.",
                  "INSIVUMEH se conserva como fuente oficial.",
                  "Vivamos Mejor aporta inventario institucional local.",
                  "PWS/Wunderground/WeatherLink se tratan como estaciones complementarias, no oficiales.",
                  "No se promedian datos crudos en este Action.",
              ],
          })

          print(f"OK registros numéricos de precipitación: {len(all_records)}")
          print(f"OK inventario consolidado de estaciones de precipitación: {len(merged_inventory)}")
          print(f"INSIVUMEH filas compatibilidad: {len(insivumeh_compat_rows)}")
          print(f"Vivamos Mejor estaciones: {len(vivamos_mejor_inventory)}")
          print(f"PWS complementarias: {len(pws_inventory)}")
          print(f"Actual: {ACTUAL_JSON}")
          print(f"Inventario: {INVENTARIO_JSON}")
          print(f"Histórico mensual: {monthly_path}")
          print(f"Vivamos Mejor: {VIVAMOS_MEJOR_JSON}")
          print(f"PWS: {PWS_JSON}")

      - name: Guardar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/precipitaciones/

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en precipitaciones."
          else
            git commit -m "Actualizar precipitaciones"
            git push
          fi
