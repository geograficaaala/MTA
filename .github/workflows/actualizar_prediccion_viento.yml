name: actualizar-prediccion-viento

on:
  workflow_dispatch:
  schedule:
    # Cada 6 horas.
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-prediccion-viento
  cancel-in-progress: false

jobs:
  actualizar-prediccion-viento:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar pronóstico de viento
        env:
          OPENMETEO_LAT: "14.7739"
          OPENMETEO_LON: "-91.1833"
          OPENMETEO_TIMEZONE: "America/Guatemala"
          OPENMETEO_FORECAST_DAYS: "16"
        run: |
          python fetch_prediccion_viento.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/viento/prediccion_viento.json
          python -m json.tool docs/data/viento/prediccion_viento.json > /dev/null
          echo "Archivo de predicción validado correctamente."

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/viento/prediccion_viento.json

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar predicción de viento"
            git push
          fi
