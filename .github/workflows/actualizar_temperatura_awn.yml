name: actualizar-temperatura-awn

on:
  workflow_dispatch:
  schedule:
    # Cada hora, minuto 15 UTC.
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-temperatura-awn
  cancel-in-progress: false

jobs:
  actualizar-temperatura-awn:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verificar secrets Ambient Weather
        env:
          API_KEY: ${{ secrets.AMBIENT_WEATHER_API_KEY }}
          APP_KEY: ${{ secrets.AMBIENT_WEATHER_APPLICATION_KEY }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$APP_KEY" ]; then
            echo "Faltan los secrets AMBIENT_WEATHER_API_KEY y/o AMBIENT_WEATHER_APPLICATION_KEY."
            exit 1
          fi
          echo "Secrets Ambient Weather disponibles."

      - name: Ejecutar descarga Ambient Weather temperatura
        env:
          AMBIENT_WEATHER_API_KEY: ${{ secrets.AMBIENT_WEATHER_API_KEY }}
          AMBIENT_WEATHER_APPLICATION_KEY: ${{ secrets.AMBIENT_WEATHER_APPLICATION_KEY }}
          AMBIENT_WEATHER_MAC_ADDRESS: ${{ secrets.AMBIENT_WEATHER_MAC_ADDRESS }}
          AMBIENT_WEATHER_STATION_NAME: ${{ secrets.AMBIENT_WEATHER_STATION_NAME }}
        run: |
          python fetch_temperatura_awn.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/temperatura/awn_temperatura.json
          python -m json.tool docs/data/temperatura/awn_temperatura.json > /dev/null
          echo "OK: docs/data/temperatura/awn_temperatura.json generado y validado"

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/temperatura/awn_temperatura.json

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar temperatura Ambient Weather"
            git push
          fi
