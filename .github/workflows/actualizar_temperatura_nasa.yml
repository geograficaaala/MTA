on:
  workflow_dispatch:
  schedule:
    # Todos los días. Guatemala = UTC-6; 12:30 UTC ≈ 06:30 GT.
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  actualizar-temperatura-nasa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests certifi

      - name: Ejecutar extracción NASA POWER temperatura
        run: |
          python fetch_temperatura_nasa.py

      - name: Verificar archivo generado
        run: |
          test -f docs/data/temperatura/historico_municipios.json
          python -m json.tool docs/data/temperatura/historico_municipios.json > /tmp/temperatura_validado.json
          echo "OK: docs/data/temperatura/historico_municipios.json generado y validado"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/temperatura/historico_municipios.json
          if git diff --cached --quiet; then
            echo "Sin cambios en datos de temperatura."
          else
            git commit -m "Actualizar temperatura NASA POWER"
            git push
