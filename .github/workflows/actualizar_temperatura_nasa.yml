name: actualizar-temperatura-nasa

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write

jobs:
  actualizar-temperatura-nasa:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar descarga NASA POWER temperatura
        run: |
          python fetch_temperatura_nasa.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/temperatura/historico_municipios.json
          python -m json.tool docs/data/temperatura/historico_municipios.json > /dev/null
          echo "OK: docs/data/temperatura/historico_municipios.json generado y validado"

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/temperatura/historico_municipios.json

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar temperatura NASA POWER"
            git push
          fi
