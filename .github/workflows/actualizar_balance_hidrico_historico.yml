name: actualizar-balance-hidrico-historico

on:
  workflow_dispatch:
  schedule:
    # Todos los días a las 12:45 UTC.
    # Equivale a las 06:45 en Guatemala.
    - cron: "45 12 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-balance-hidrico-historico
  cancel-in-progress: false

jobs:
  actualizar-balance-hidrico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar balance hídrico histórico
        run: |
          python fetch_balance_hidrico_historico.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/agroclima/historico_municipios.json
          python -m json.tool docs/data/agroclima/historico_municipios.json > /dev/null
          echo "Archivo histórico agroclimático generado y validado correctamente."

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/agroclima/historico_municipios.json

          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
          else
            git commit -m "Actualizar balance hídrico histórico"
            git push
          fi
