name: actualizar-prediccion-temperatura

on:
  workflow_dispatch:
  schedule:
    # Todos los días a las 11:35 UTC, 05:35 hora Guatemala.
    - cron: "35 11 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-prediccion-temperatura
  cancel-in-progress: false

jobs:
  actualizar-prediccion-temperatura:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar descarga Open-Meteo temperatura
        env:
          OPENMETEO_LAT: "14.7739"
          OPENMETEO_LON: "-91.1833"
          OPENMETEO_TIMEZONE: "America/Guatemala"
          OPENMETEO_FORECAST_DAYS: "16"
        run: |
          python fetch_prediccion_temperatura.py

      - name: Validar archivo generado
        run: |
          test -f docs/data/temperatura/prediccion_temperatura.json
          python -m json.tool docs/data/temperatura/prediccion_temperatura.json > /dev/null
          echo "OK: docs/data/temperatura/prediccion_temperatura.json generado y validado"

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/temperatura/prediccion_temperatura.json

          if git diff --cached --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "Actualizar pronostico temperatura Open-Meteo"
            git push
          fi
